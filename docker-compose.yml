# Local / single-server deployment. For Azure, the same images run on Container Apps with
# Azure Database for PostgreSQL, Azure Cache for Redis and Azure Files/Blob for /data.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: cnc, POSTGRES_PASSWORD: cnc, POSTGRES_DB: cncquote }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  api:
    build: ./backend
    env_file: .env
    environment: { DATABASE_URL: "postgresql+psycopg://cnc:cnc@db:5432/cncquote", REDIS_URL: "redis://redis:6379/0" }
    volumes: [files:/data/files]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: rq worker analysis mail --url redis://redis:6379/0
    env_file: .env
    environment: { DATABASE_URL: "postgresql+psycopg://cnc:cnc@db:5432/cncquote", REDIS_URL: "redis://redis:6379/0" }
    volumes: [files:/data/files]
    depends_on: [db, redis]
  poller:
    build: ./backend
    command: python -m app.poller
    env_file: .env
    environment: { DATABASE_URL: "postgresql+psycopg://cnc:cnc@db:5432/cncquote", REDIS_URL: "redis://redis:6379/0" }
    volumes: [files:/data/files]
    depends_on: [db, redis]
  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes: { pgdata: {}, files: {} }
