# Local / single-server deployment: same image as Render (web + API + worker + poller in one container).
# cp .env.example .env, then: docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: cnc, POSTGRES_PASSWORD: cnc, POSTGRES_DB: cncquote }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  app:
    build: .
    env_file: .env
    environment: { DATABASE_URL: "postgresql+psycopg://cnc:cnc@db:5432/cncquote", REDIS_URL: "redis://redis:6379/0", PORT: "8000" }
    ports: ["8080:8000"]
    volumes: [files:/data]
    depends_on: [db, redis]
volumes: { pgdata: {}, files: {} }
