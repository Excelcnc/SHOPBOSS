<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel SHOPBOSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>/*
VOICE  : shop-floor estimating software, calm and dense; a tool that opens mid-use.
IDEA   : a mail client for RFQs: inbox list -> RFQ packet -> part costing sheet beside the drawing.
PICTURE: the inbox, the parts table, the nine costing cards and the drawing itself.
COLOUR : RFQ Workbench palette: navy app bar, cool grey ground, white panels, blue actions; Excel CNC red as the brand accent only.
TYPE   : Inter for UI, IBM Plex Mono for numbers and part numbers. LAYOUT: app bar, slim icon rail, ribbon, panes.
*/
:root{color-scheme:light;
--bg:#f3f5f8;--panel:#fff;--bg2:#f8f9fb;--bg3:#eef1f5;--ink:#1a2330;--ink2:#5d6a79;--mute:#8b96a5;--line:#e1e5eb;--line2:#d3d9e1;
--navy:#102a54;--navy2:#1b3a6e;--blue:#2160c4;--blue2:#1b4fa3;--bluebg:#e7eefb;--sel:#dde8fa;--hover:#f1f5fb;
--red:#c8202f;--redbg:#fbe6e3;--orange:#a96a12;--orbg:#fbf1df;--green:#1f7a4d;--grbg:#e2f3ea;--purple:#2160c4;
--r:8px;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;--shadow:0 1px 2px rgba(16,42,84,.08),0 6px 20px rgba(16,42,84,.10)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mute{color:var(--mute)}.ink2{color:var(--ink2)}
.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.hide{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:15px;height:15px}

/* ---- shell: app bar / rail / ribbon ---- */
#app{display:grid;grid-template-rows:46px minmax(0,1fr);height:100vh}
.appbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap;letter-spacing:.01em}
.brand .mk{width:28px;height:28px;border-radius:6px;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:-.3px;color:#fff}
.brand small{font-weight:500;opacity:.7;font-size:12px}
.wm{gap:7px;font-size:17px;line-height:1;letter-spacing:.06em;align-items:baseline}
.wm-ex{font-weight:800;color:#d9dee6;background:linear-gradient(180deg,#ffffff 0%,#dfe4eb 45%,#a9b2bf 55%,#e9edf2 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.wm-sb{font-weight:900;font-style:italic;color:#ff3347;letter-spacing:.04em;text-shadow:0 0 14px rgba(255,51,71,.35)}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){.wm-ex{-webkit-text-fill-color:#d9dee6}}
.appbar .search{flex:1;max-width:560px;margin:0 auto;position:relative}
.appbar .search input{width:100%;height:32px;border-radius:6px;border:1px solid transparent;background:rgba(255,255,255,.14);color:#fff;padding:0 10px 0 32px;font-size:13px}
.appbar .search input::placeholder{color:rgba(255,255,255,.65)}
.appbar .search input:focus{background:#fff;color:var(--ink);outline:none;border-color:var(--blue)}
.appbar .search svg{position:absolute;left:9px;top:8px;opacity:.8}
#savebar{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;opacity:.88;white-space:nowrap}
#savebar::before{content:"";width:7px;height:7px;border-radius:50%;background:#5cc58e}
#savebar.local::before{background:#e2a64a}#savebar.err::before{background:#f07a6d}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none;line-height:1}
.shell{display:grid;grid-template-columns:62px minmax(0,1fr);min-height:0}
#rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow-y:auto}
.rl{width:54px;border:0;background:none;border-radius:7px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink2);font-size:10px;font-weight:600;position:relative}
.rl:hover{background:var(--hover);color:var(--ink)}
.rl.on{background:var(--sel);color:var(--blue)}
.rl.on::before{content:"";position:absolute;left:-4px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--blue)}
.rl svg.i{width:19px;height:19px}
.rl .n{position:absolute;top:3px;right:7px;background:var(--blue);color:#fff;border-radius:999px;font-size:9px;padding:0 4px;line-height:14px}
.rl.plus svg.i{width:22px;height:22px}
.rail-sp{flex:1}
.itar{font-size:8.5px;font-weight:800;letter-spacing:.03em;border:1.5px solid var(--red);color:var(--red);border-radius:4px;padding:2px 3px;text-align:center;line-height:1.15;margin:4px 0 6px}
#main{display:flex;flex-direction:column;min-height:0}
#top{display:flex;align-items:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 14px;min-height:44px;flex:none;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
#top h1{font-size:15px;font-weight:650;margin:0 6px 0 0;white-space:nowrap}
.rsep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
#view{flex:1;min-height:0;overflow:auto}
.crumb{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);white-space:nowrap}
.crumb b{color:var(--ink)}
.search{position:relative;flex:1;max-width:420px}
.search input{width:100%;height:32px;border:1px solid var(--line2);border-radius:6px;padding:0 10px 0 32px;background:var(--panel)}
.search svg{position:absolute;left:9px;top:8px;color:var(--mute)}

/* ---- buttons ---- */
.btn{height:32px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:12.5px;white-space:nowrap;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--hover);border-color:var(--mute)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--blue2);border-color:var(--blue2)}
.btn.red{background:var(--panel);border-color:#efb7b0;color:var(--red)}
.btn.red:hover:not(:disabled){background:var(--redbg);border-color:var(--red)}
.btn.redf{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover:not(:disabled){background:var(--hover);border-color:transparent}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:5px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn.sm.icon{width:28px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ai{border-color:#b9cdf0;color:var(--blue);background:var(--bluebg)}
.btn.ai:hover:not(:disabled){background:var(--sel)}
.rb{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 9px;border-radius:5px;white-space:nowrap;color:var(--ink);font-size:12.5px}
.rb:hover:not(:disabled){background:var(--hover)}
.rb.pri{background:var(--blue);color:#fff}.rb.pri:hover{background:var(--blue2)}
.rb.danger{color:var(--red)}
.rb:disabled{opacity:.42;cursor:default}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;flex:none}
.seg2 button{border:0;background:var(--panel);padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink2);display:inline-flex;gap:5px;align-items:center}
.seg2 button+button{border-left:1px solid var(--line2)}
.seg2 button.on{background:var(--sel);color:var(--blue)}

/* ---- pills / badges ---- */
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;background:var(--bg3);color:var(--ink2);font-size:11px;font-weight:600;white-space:nowrap}
.pill.blue{background:var(--bluebg);color:var(--blue)}
.pill.red{background:var(--redbg);color:var(--red)}
.pill.or{background:var(--orbg);color:var(--orange)}
.pill.gr{background:var(--grbg);color:var(--green)}
.pill.pur{background:var(--bluebg);color:var(--blue)}
.badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;white-space:nowrap;background:var(--navy);color:#fff}
.b-mill{background:var(--navy);color:#fff}.b-turn{background:#0f5e45;color:#fff}.b-sheet{background:#7a4a06;color:#fff}
.b-wj{background:#0b5b73;color:#fff}.b-asm{background:#43328f;color:#fff}.b-hw{background:var(--bg3);color:var(--ink2)}
.beta{font-size:9px;font-weight:800;color:var(--green);background:var(--grbg);border-radius:4px;padding:1px 5px;letter-spacing:.05em;margin-right:3px}
.conf{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--mute);white-space:nowrap}
.conf i{display:inline-block;width:7px;height:7px;border-radius:50%}
.c-hi i{background:var(--green)}.c-md i{background:#e2a64a}.c-lo i{background:var(--red)}
.warn{color:#d9822b}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink2);white-space:nowrap}
button.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--bluebg);border-color:transparent;color:var(--blue);font-weight:600}
.chip .c{font-size:11px;opacity:.75}

/* ---- tables ---- */
table{border-collapse:collapse;width:100%}
.tbl th{font-size:11.5px;font-weight:600;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--bg2);position:sticky;top:0;z-index:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--panel)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tbody tr:focus{outline:2px solid var(--blue);outline-offset:-2px}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto}
.thumbs{display:flex;align-items:center;gap:4px}
.thumb{width:32px;height:26px;border:1px solid var(--line);border-radius:4px;background:#fff center/cover no-repeat;display:grid;place-items:center;color:var(--mute);flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain}
.more{font-size:11px;font-weight:700;color:var(--ink2);background:var(--bg3);border-radius:4px;padding:3px 5px}
.stat{min-width:120px}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;width:120px}
.segs i{height:5px;border-radius:3px;background:var(--line)}
.segs i.f{background:var(--blue)}
.segs.nb i{background:#f2c4be}.segs.ord i.f{background:var(--green)}
.segl{font-size:11.5px;color:var(--ink2);margin-top:3px}

/* ---- popovers / modals ---- */
.pop{position:fixed;overflow:auto;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:200px}
.pop label{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:5px;cursor:pointer}
.pop label:hover,.pop button.mi:hover{background:var(--hover)}
.pop button.mi{display:flex;width:100%;border:0;background:none;padding:7px 10px;border-radius:5px;gap:8px;align-items:center;text-align:left}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.empty svg.i{width:38px;height:38px;color:#b7c0cc;margin-bottom:6px}
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.38);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(700px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.wide{width:min(1000px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:16px;flex:1}
.mb{padding:16px 18px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>span{font-size:11.5px;font-weight:600;color:var(--ink2)}
.inp{height:32px;border:1px solid var(--line2);border-radius:6px;padding:0 9px;background:var(--panel);font-size:13px;width:100%}
textarea.inp{height:auto;min-height:72px;padding:7px 9px;resize:vertical}
.inp.n{text-align:right;font-family:var(--mono);font-size:12.5px}
.drop{border:1.5px dashed var(--line2);border-radius:8px;padding:20px;text-align:center;color:var(--ink2);background:var(--bg2)}
.drop.over{border-color:var(--blue);background:var(--bluebg)}
.flist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.fitem{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:6px}

/* ---- inbox (list | workspace) ---- */
.panes{display:grid;grid-template-columns:350px minmax(0,1fr);height:100%}
.list{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.list-head{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.list-head .r1{display:flex;align-items:center;gap:8px}
.list-head h2{margin:0;font-size:16px;font-weight:650}
.list-head select{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:3px 6px;font-size:12px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.items{overflow-y:auto;flex:1}
.it{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:1px 10px;padding:9px 12px 9px 10px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.it:hover{background:var(--hover)}
.it.on{background:var(--sel)}
.it.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.it .avatar{grid-row:1/5;margin-top:2px}
.it .who{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:5px;align-items:center}
.it .who .warn svg{width:14px;height:14px}
.it .when{font-size:11.5px;color:var(--ink2);text-align:right;white-space:nowrap}
.it .sub{grid-column:2/4;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.it .sub .mono{font-weight:600;color:var(--blue)}
.it .meta{grid-column:2/4;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);margin-top:3px}
.it .meta .thumb{width:26px;height:22px}
.it .segs{width:64px}
.ws{display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.ws-head{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 18px 0}
.ws-title{display:flex;align-items:flex-start;gap:10px}
.ws-title h1{font-size:18px;margin:0;font-weight:650;line-height:1.3;flex:1}
.ws-title h1 .mono{font-size:14px;color:var(--ink2);font-weight:500;margin-left:6px}
.ws-sub{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--ink2)}
.ws-sub b{color:var(--ink);font-weight:600}
.ws-sub>span{display:inline-flex;align-items:center;gap:5px}
.stepper{display:flex;flex-wrap:wrap;margin-top:10px}
.step{display:flex;align-items:center;gap:8px;padding:10px 20px 10px 14px;font-size:13.5px;font-weight:600;min-width:120px;justify-content:center;box-shadow:0 1px 2px rgba(16,42,84,.08);color:var(--ink2);background:var(--bg2);border:1px solid var(--line);margin:0 -1px -1px 0;cursor:pointer;white-space:nowrap}
.step:first-child{border-radius:6px 0 0 6px}.step:last-child{border-radius:0 6px 6px 0}
.step:hover{background:var(--sel);color:var(--blue);border-color:var(--blue)}.step:active{transform:translateY(1px)}
.step.done{color:var(--green)}
.step.cur{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
.step.nb{background:var(--redbg);color:var(--red);border-color:#efb7b0;font-weight:600}
.step .d{width:20px;height:20px;font-size:10.5px;border-radius:50%;display:grid;place-items:center;border:1.5px solid currentColor;font-size:9px;font-weight:700}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:8px 12px;color:var(--ink2);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tabs .n{font-size:11px;background:var(--bg3);color:var(--ink2);border-radius:999px;padding:0 6px}
.dmain{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:14px;font-weight:650;display:flex;align-items:center;gap:7px}
.card-b{padding:12px 14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
.email-b{white-space:pre-wrap;font-size:12.5px;color:var(--ink2);max-height:140px;overflow:auto;margin-top:6px;line-height:1.55}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:228px;overflow:auto}
.fcard{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);position:relative}
.fcard:hover{border-color:var(--blue)}
.fcard .ft{height:80px;background:var(--bg2);display:grid;place-items:center;color:var(--mute);border-bottom:1px solid var(--line)}
.fcard .ft img{max-width:100%;max-height:80px}
.fcard .fb{padding:6px 8px}
.fcard .fn{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .fun{position:absolute;top:5px;right:5px;background:var(--panel)}
.flrow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line)}
.ptbl td{padding:8px 10px}
.ptbl tr.child td{background:var(--bg2)}
.ptbl tr.child td:first-child{padding-left:26px}
.lnk{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.nofile{font-size:12px;color:#d9822b}
.qtyp{display:inline-flex;gap:4px;flex-wrap:wrap}
.qtyp span{font-family:var(--mono);font-size:12px;background:var(--bg3);border-radius:4px;padding:1px 6px}
.dfoot{background:var(--panel);border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center;flex:none}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.prog .bar{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .bar b{display:block;height:100%;background:var(--green)}
.backbtn{display:none}

/* ---- part quote screen ---- */
.qs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100%}
.qs-l{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.qs-scroll{overflow:auto;flex:1;padding:12px 16px 20px}
.qs-r{display:flex;flex-direction:column;min-height:0;background:#4d5663}
.vtool{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.vstage{flex:1;overflow:auto;position:relative;display:block;padding:14px}
.vwrap{position:relative;margin:0 auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35);transform-origin:top left}
.vwrap canvas{display:block;width:100%;height:auto}

/* ---- orders board (lanes) ---- */
.ovw{display:flex;flex-direction:column;min-height:100%}
.ob{position:relative}
.ub{position:sticky;top:0;z-index:6;background:var(--bg);padding:12px 18px 10px;border-bottom:1px solid var(--line);box-shadow:0 4px 10px -8px rgba(16,42,84,.35)}

.lanes{padding:12px 18px 24px;display:flex;flex-direction:column;gap:10px}

.lane .run{padding:8px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:5px}
.lane .q{padding:8px;min-width:0;display:flex;flex-direction:column;gap:5px}

.qrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;align-items:stretch;min-height:58px}

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=(p="")=>p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const clone=o=>JSON.parse(JSON.stringify(o));
const num=(v,d=0)=>{const n=parseFloat(String(v).replace(/[$,]/g,""));return isFinite(n)?n:d};
const r2=v=>Math.round(v*100)/100;
const money=(v,dec=2)=>(v<0?"-":"")+"$"+Math.abs(v||0).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const money0=v=>money(v,0);
const pct=v=>(v||0).toFixed(0)+"%";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDT(iso){ if(!iso) return "—"; const d=new Date(iso); if(isNaN(d)) return esc(iso); let h=d.getHours(),m=d.getMinutes(),ap=h>=12?"PM":"AM"; h=h%12||12; return `${MON[d.getMonth()]} ${d.getDate()}, ${h}:${String(m).padStart(2,"0")} ${ap}`; }
function fmtD(iso){ if(!iso) return ""; const d=/^\d{4}-\d\d-\d\d$/.test(String(iso))?new Date(iso+"T00:00:00"):new Date(iso); if(isNaN(d)) return String(iso); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function ago(iso){ if(!iso) return "—"; const t=new Date(iso).getTime(); if(isNaN(t)) return "—"; const s=(Date.now()-t)/1000; const f=(n,u)=>`${Math.floor(n)} ${u}${Math.floor(n)===1?"":"s"} ago`;
  if(s<60) return "just now"; if(s<3600) return f(s/60,"minute"); if(s<86400) return f(s/3600,"hour"); if(s<86400*30) return f(s/86400,"day"); if(s<86400*365) return f(s/86400/30,"month"); return f(s/86400/365,"year"); }
function toast(msg,ms=2600){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function confCls(c){ return c>=0.85?"c-hi":c>=0.6?"c-md":"c-lo"; }
function confHTML(c,src){ if(c==null) return ""; return `<span class="conf ${confCls(c)}" title="${esc(src||"")}"><i></i>${Math.round(c*100)}%</span>`; }

function normPart(p,r){

function configDoc(){ return {settings:S.settings,materials:S.materials,processes:S.processes,machines:S.machines,version:2}; }
async function flush(){
  if(flushing){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,400); return; }
  flushing=true; lastSaveErr="";
  const keys=[...dirty]; dirty.clear();
  writeCache();
  if(MODE==="db"&&DB){
    for(const k of keys){
      try{
        const [kind,id]=k.split(/:(.+)/);
        if(kind==="config") await dbWrite(DB.doc("config/main"),configDoc());
        else if(kind==="rfq"){ const r=S.rfqs.find(x=>x.id===id); if(r){ const body=clone(r); const sz=JSON.stringify(body).length; if(sz>250000) throw {code:"too_big",message:`RFQ ${r.number} is ${Math.round(sz/1024)} KB; the limit per RFQ is 250 KB. Remove pasted notes or split the RFQ.`}; await dbWrite(DB.doc("rfqs/"+id),body); } }
        else if(kind==="order"){ const o=S.orders.find(x=>x.id===id); if(o) await dbWrite(DB.doc("orders/"+id),clone(o)); }
        else if(kind==="del-rfq") await DB.doc("rfqs/"+id).delete();
        else if(kind==="del-order") await DB.doc("orders/"+id).delete();
      }catch(e){ console.error(e); lastSaveErr=e?.code==="quota_exceeded"?"Storage is full: "+(e.message||""):(e?.message||"Save failed"); if(e?.code==="unavailable") dirty.add(k); }
    }
  }
  flushing=false;
  if(dirty.size){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,3000); }
  setSave(lastSaveErr?("Not saved: "+lastSaveErr):(MODE==="db"?"All changes saved":MODE==="local"?"Saved in this browser only":"Not saved (no storage here)"),!!lastSaveErr||MODE==="memory");
}
async function dbWrite(ref,body){ try{ await ref.set(body); }catch(e){ if(e?.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*800)); await ref.set(body); } else throw e; } }
function setSave(t,err){ const el=$("savebar"); if(!el) return; el.textContent=t; el.classList.toggle("err",!!err); }

function stableStr(o){ return JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v); }

function mergeDeep(a,b){ for(const k in b){ if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object") mergeDeep(a[k],b[k]); else a[k]=b[k]; } return a; }
let pendingRender=false;

const ftype=name=>{ const e=(name.split(".").pop()||"").toLowerCase();
  if(["pdf","png","jpg","jpeg","webp","dxf","tif","tiff"].includes(e)) return "Drawing";
  if(["step","stp","igs","iges","stl","x_t","x_b","sldprt","prt","sat"].includes(e)) return "CAD";
  if(["xlsx","xls","csv"].includes(e)) return "BOM"; return "Others"; };
async function storeFile(file){
  const meta={id:uid("f"),name:file.name,type:ftype(file.name),size:file.size,at:new Date().toISOString(),partId:null};
  const buf=await file.arrayBuffer();
  MEMFILES[meta.id]=buf;
  if(ASSETS){ try{ const a=await ASSETS.upload(new Blob([buf],{type:file.type||"application/octet-stream"})); meta.ref="asset"; meta.assetId=a.id; meta.url=a.url; return meta; }catch(e){ console.warn("asset upload failed",e); } }
  if(MODE==="db"&&DB&&file.size<15e6){ try{ const b64=bufToB64(buf), CH=200000, n=Math.ceil(b64.length/CH);
      for(let k=0;k<n;k++) await dbWrite(DB.doc(`files/${meta.id}_c${k}`),{d:b64.slice(k*CH,(k+1)*CH)});
      await dbWrite(DB.doc("files/"+meta.id),{name:file.name,n,size:file.size}); meta.ref="db"; return meta; }catch(e){ console.warn(e); toast("Couldn't store "+file.name+" in the cloud: "+(e.message||e.code)); } }
  meta.ref="mem"; meta.note="Stored for this session only (file storage not available here)."; return meta;
}
function bufToB64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function b64ToBuf(b64){ const s=atob(b64); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }
async function fileBytes(f){
  if(!f) return null;
  if(MEMFILES[f.id]) return MEMFILES[f.id].slice(0);
  try{
    if(f.ref==="seed"&&SEED_FILES[f.seedId]){ const b=b64ToBuf(SEED_FILES[f.seedId]); MEMFILES[f.id]=b; return b.slice(0); }
    if(f.ref==="asset"){ const r=await fetch(f.url||("/_blob/"+f.assetId)); if(!r.ok) throw new Error("HTTP "+r.status); const b=await r.arrayBuffer(); MEMFILES[f.id]=b; return b.slice(0); }
    if(f.ref==="db"&&DB){ const d=await DB.doc("files/"+f.id).get(); if(d.exists){ const m=d.data(); let b64=m.b64||""; for(let k=0;k<(m.n||0);k++){ const c=await DB.doc(`files/${f.id}_c${k}`).get(); if(!c.exists) throw new Error("missing file chunk"); b64+=c.data().d; } const b=b64ToBuf(b64); MEMFILES[f.id]=b; return b.slice(0); } }
  }catch(e){ console.warn("file read failed",f.name,e); }
  return null;
}

if(window.pdfjsLib){ try{ pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){} }
const DOCS={};   // fileId -> {kind,pdf,pages,img,dxfCanvas,lines:{page:[...]},error}
const THUMBS={}; // fileId -> dataURL | "none"
const extOf=n=>(String(n||"").split(".").pop()||"").toLowerCase();
async function loadDoc(f){
  if(!f) return null; if(DOCS[f.id]) return DOCS[f.id];
  const D={kind:null,pages:1,lines:{},error:null}; DOCS[f.id]=D;
  const e=extOf(f.name);
  try{
    const buf=await fileBytes(f);
    if(!buf) throw new Error(f.ref==="missing"?"The original file was not kept by ShopBoss. Upload the drawing again with the + button.":"The file could not be read.");
    if(e==="pdf"){
      for(let i=0;i<40&&!window.pdfjsLib;i++) await new Promise(r=>setTimeout(r,100));
      if(!window.pdfjsLib) throw new Error("The PDF reader did not load. Reload the page to view PDFs.");
      D.pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false,useSystemFonts:true}).promise; D.pages=D.pdf.numPages; D.kind="pdf";
    }else if(["png","jpg","jpeg","webp"].includes(e)){ D.img=await createImageBitmap(new Blob([buf])); D.kind="img"; }
    else if(e==="dxf"){ D.dxf=dxfToCanvas(new TextDecoder().decode(buf)); D.kind="dxf"; D.lines[1]=D.dxf.lines; }
    else throw new Error("No viewer for ."+e+" files. Drawings can be PDF, DXF, PNG or JPG.");
  }catch(err){ D.error=err.message||String(err); }
  return D;
}
async function renderDocPage(D,page,maxSide=2600){
  const c=document.createElement("canvas"), g=c.getContext("2d");
  if(D.kind==="pdf"){
    const pg=await D.pdf.getPage(page); const v1=pg.getViewport({scale:1}); const sc=Math.min(5,maxSide/Math.max(v1.width,v1.height)); const vp=pg.getViewport({scale:sc});
    c.width=Math.round(vp.width); c.height=Math.round(vp.height); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:g,viewport:vp}).promise;
    if(!D.lines[page]){ const tc=await pg.getTextContent(); D.lines[page]=groupLinesPos(tc.items,vp,c.width,c.height); }
  }else if(D.kind==="img"){ const s=Math.min(1,maxSide/Math.max(D.img.width,D.img.height)); c.width=Math.round(D.img.width*s); c.height=Math.round(D.img.height*s); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(D.img,0,0,c.width,c.height); D.lines[page]=D.lines[page]||[]; }
  else if(D.kind==="dxf"){ const s=Math.min(1,maxSide/Math.max(D.dxf.canvas.width,D.dxf.canvas.height)); c.width=Math.round(D.dxf.canvas.width*s); c.height=Math.round(D.dxf.canvas.height*s); g.drawImage(D.dxf.canvas,0,0,c.width,c.height); }
  return c;
}
function groupLinesPos(items,vp,W,H){
  const its=items.filter(i=>i.str&&i.str.trim()).map(i=>{ const [x,y]=vp.convertToViewportPoint(i.transform[4],i.transform[5]); const h=Math.hypot(i.transform[2],i.transform[3])*vp.scale||8;
    return {s:i.str,x,y,h,w:(i.width||i.str.length*h*0.5)*vp.scale,ang:Math.atan2(i.transform[1],i.transform[0])}; });
  const flat=its.filter(i=>Math.abs(i.ang)<0.1), rot=its.filter(i=>Math.abs(i.ang)>=0.1);
  flat.sort((a,b)=>a.y-b.y||a.x-b.x);
  const L=[];
  for(const it of flat){ const l=L.find(l=>Math.abs(l.y-it.y)<Math.max(2,it.h*0.4)&&it.x-l.x1<it.h*3&&it.x>=l.x0-it.h); if(l){ l.items.push(it); l.x1=Math.max(l.x1,it.x+it.w); l.h=Math.max(l.h,it.h); } else L.push({y:it.y,x0:it.x,x1:it.x+it.w,h:it.h,items:[it]}); }
  const out=L.map(l=>({t:l.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim(),x:l.x0/W,y:(l.y-l.h)/H,w:(l.x1-l.x0)/W,h:l.h*1.25/H}));
  return out.concat(rot.map(i=>({t:i.s.trim(),x:i.x/W,y:(i.y-i.h)/H,w:i.h/W,h:i.w/H}))).filter(l=>l.t);
}
function dxfToCanvas(text){
  const P=window.DxfParser?.default||window.DxfParser; if(!P) throw new Error("The DXF reader did not load. Reload the page to view DXF files.");
  const dxf=new P().parseSync(text); const ents=dxf.entities||[];
  let mn=[Infinity,Infinity],mx=[-Infinity,-Infinity]; const ext=(x,y)=>{if(isFinite(x)&&isFinite(y)){mn[0]=Math.min(mn[0],x);mn[1]=Math.min(mn[1],y);mx[0]=Math.max(mx[0],x);mx[1]=Math.max(mx[1],y);}};
  const clean=t=>t.replace(/\\P/g," ").replace(/\\[A-Za-z][^;]*;/g,"").replace(/[{}]/g,"").replace(/%%c/gi,"Ø").replace(/%%p/gi,"±").replace(/%%d/gi,"°");
  const texts=[];
  for(const e of ents){ if(e.vertices) e.vertices.forEach(v=>ext(v.x,v.y)); if(e.center&&e.radius){ext(e.center.x-e.radius,e.center.y-e.radius);ext(e.center.x+e.radius,e.center.y+e.radius);} const p=e.startPoint||e.position; if((e.type==="TEXT"||e.type==="MTEXT")&&e.text&&p){ ext(p.x,p.y); texts.push({t:clean(e.text),p}); } if(e.type==="DIMENSION"&&e.text) texts.push({t:clean(e.text),p:e.middleOfText||null}); }
  if(!isFinite(mn[0])) throw new Error("No drawable geometry in this DXF.");
  const W=mx[0]-mn[0]||1,H=mx[1]-mn[1]||1,S=2600/Math.max(W,H),pad=30;
  const c=document.createElement("canvas"); c.width=Math.ceil(W*S)+pad*2; c.height=Math.ceil(H*S)+pad*2;
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.strokeStyle="#111"; g.fillStyle="#111"; g.lineWidth=1.3;
  const X=x=>pad+(x-mn[0])*S, Y=y=>c.height-pad-(y-mn[1])*S;
  for(const e of ents){ g.beginPath();
    if((e.type==="LINE"||e.type==="LWPOLYLINE"||e.type==="POLYLINE")&&e.vertices?.length){ e.vertices.forEach((v,i)=>i?g.lineTo(X(v.x),Y(v.y)):g.moveTo(X(v.x),Y(v.y))); if(e.shape) g.closePath(); g.stroke(); }
    else if(e.type==="CIRCLE"){ g.arc(X(e.center.x),Y(e.center.y),e.radius*S,0,2*Math.PI); g.stroke(); }
    else if(e.type==="ARC"){ g.arc(X(e.center.x),Y(e.center.y),e.radius*S,-e.endAngle,-e.startAngle); g.stroke(); }
    else if((e.type==="TEXT"||e.type==="MTEXT")&&e.text){ const p=e.startPoint||e.position; if(!p) continue; const h=Math.max(8,(e.textHeight||e.height||2.5)*S); g.font=`${h}px sans-serif`; g.fillText(clean(e.text),X(p.x),Y(p.y)); } }
  const lines=texts.map(t=>t.p?{t:t.t,x:(X(t.p.x))/c.width,y:(Y(t.p.y)-14)/c.height,w:0.12,h:0.02}:{t:t.t});
  return {canvas:c,lines};
}
async function thumbFor(f){
  if(!f) return "none"; if(THUMBS[f.id]) return THUMBS[f.id];
  if(f.type!=="Drawing"){ THUMBS[f.id]="none"; return "none"; }
  const D=await loadDoc(f); if(!D||D.error){ THUMBS[f.id]="none"; return "none"; }
  try{ const c=await renderDocPage(D,1,900); const t=document.createElement("canvas"); const s=220/Math.max(c.width,c.height); t.width=Math.round(c.width*s); t.height=Math.round(c.height*s); t.getContext("2d").drawImage(c,0,0,t.width,t.height); THUMBS[f.id]=t.toDataURL("image/png"); }
  catch(e){ THUMBS[f.id]="none"; }
  return THUMBS[f.id];
}
function hydrateThumbs(root=document){
  root.querySelectorAll("[data-thumb]").forEach(async el=>{ const [rid,fid]=el.dataset.thumb.split("|"); const r=S.rfqs.find(x=>x.id===rid); const f=r?.files.find(x=>x.id===fid); if(!f) return;
    const u=await thumbFor(f); if(!el.isConnected) return; el.removeAttribute("data-thumb"); el.innerHTML=u&&u!=="none"?`<img alt="" src="${u}">`:ic("eyeoff","s"); el.title=u==="none"?"No preview":f.name; });
}

/* ================= TITLE BLOCK (reused from CNC Part Inspector, extended) ================= */
const reStd=/\b(ASTM|AMS|MIL(?:-[A-Z]+)?|ASME|ANSI|ISO|DIN|SAE|QQ|EN|JIS|AS|NAS|MS)[\s-]?[A-Z]{0,3}[\d][\w.\-]*(?:\s+TYPE\s+[IVX]+)?(?:,?\s+CLASS\s+\d+[A-Z]?)?(?:,?\s+GRADE\s+\w+)?/g;
const GDT_SYM=[["⌖","position"],["⌓","profile of a surface"],["⌒","profile of a line"],["⏥","flatness"],["▱","flatness"],["⊥","perpendicularity"],["⫽","parallelism"],["∥","parallelism"],["↗","runout"],["⌰","total runout"],["◎","concentricity"],["⌭","cylindricity"],["○","circularity"],["∠","angularity"],["⌯","symmetry"]];
const GDT_WORDS=[[/\bTRUE POSITION|\bPOSITION\b/i,"position"],[/\bFLATNESS|\bFLAT WITHIN/i,"flatness"],[/\bPERPENDICULAR/i,"perpendicularity"],[/\bPARALLEL/i,"parallelism"],[/\bRUNOUT|\bT\.?I\.?R\.?\b/i,"runout"],[/\bCONCENTRIC/i,"concentricity"],[/\bCYLINDRICITY/i,"cylindricity"],[/\bPROFILE\b/i,"profile"]];
function extractTitleBlock(lines,fileName){
  const txt=lines.map(l=>typeof l==="string"?l:l.t);
  const tb={}, tols=[], notes=[], hits=[];
  const BAD=/^(?:VENDOR|QTY|DESCRIPTION|ITEM|PART\s*(?:NO|NUMBER)|SIZE|NONE|N\/A|-+)$/i;
  const set=(k,v,c,idx)=>{ v=String(v||"").trim().replace(/\s{2,}/g," ").replace(/[.,;:]+$/,""); if(!v||BAD.test(v)||/^\/|\bVENDOR$/i.test(v)) return; if(!tb[k]||tb[k].c<c){ tb[k]={v:v.slice(0,160),c,s:"drawing text layer"}; if(idx!=null) hits.push({k,idx}); } };
  const grab=(k,re,c=0.9)=>{ txt.forEach((l,i)=>{ const m=l.match(re); if(m&&m[1]) set(k,m[1],c,i); }); };
  grab("description",/^(?:TITLE|DESCRIPTION|PART NAME)[:\s]+(.{3,70})$/i);
  grab("part_number",/(?:PART|DWG|DRAWING|P\/N)\s*(?:NO\.?|NUMBER|#|N\b)?[:\s]*([A-Z0-9][A-Z0-9\-_.\/]{2,30})/i,0.85);
  grab("revision",/\bREV(?:ISION)?\.?[:\s]+([A-Z0-9]{1,3})\b/i);
  grab("scale",/\bSCALE[:\s]+(\d+(?:\.\d+)?\s*:\s*\d+(?:\.\d+)?|NTS|NONE|FULL)/i);
  grab("sheet",/\bSHEET[:\s]+(\d+\s*(?:OF|\/)\s*\d+)/i);
  grab("units",/\bUNITS?[:\s]+(MM|INCH(?:ES)?|IN)\b/i);
  grab("units",/DIMENSIONS ARE IN (INCHES|MILLIMETERS|MM)/i,0.85);
  grab("material",/\bMAT(?:ERIA)?L?\.?[:\s]+([A-Z0-9][^;]{2,70})/i);
  grab("finish",/\b(?:FINISH|COATING|PLATING|TREATMENT)[:\s]+([A-Z0-9][^;]{2,80})/i);
  grab("company",/\bCAGE\s*(?:CODE)?[:\s#]*([0-9A-Z]{5})\b/i);
  grab("standard",/\b((?:ASME|ANSI)\s*Y14\.5[\w.\-]*|ISO\s*1101[\w:.\-]*|ISO\s*GPS)/i);
  // general tolerance block: collect neighbouring lines
  txt.forEach((l,i)=>{ if(/UNLESS OTHERWISE SPECIFIED|TOLERANCES?\s*:|^\s*\.?X{1,4}\s*[=±]|X\.XX?X?\s*±|ANGLES?\s*±|ISO\s*2768/i.test(l)){ const block=[l]; for(let j=i+1;j<Math.min(txt.length,i+5);j++){ if(/^\s*(?:\.X|X\.|ANGLE|FRACT|±|\.\d)/i.test(txt[j])||/±/.test(txt[j])&&txt[j].length<40) block.push(txt[j]); else break; } const v=block.join("  "); if(/±|2768/.test(v)) set("gen_tol",v.replace(/UNLESS OTHERWISE SPECIFIED[:,]?\s*/i,"UOS: "),0.85,i); } });

    let m;
    if(/HEAT\s*TREAT|\bHRC\s*\d|\bRC\s?\d{2}|HARDEN(?:ED)?\s+(?:TO|PER)|AMS\s*27\d\d|AMS\s*2759|SOLUTION\s*(?:TREAT|ANNEAL)|PRECIPITATION\s*HARDEN|\bAGE(?:D)?\s+(?:PER|TO|AT)|\bCOND(?:ITION)?\.?\s*H\d{3,4}\b|\bH(?:900|925|1025|1075|1100|1150)\b|STRESS RELIEV|\bANNEAL/i.test(l)) set("heat_treat",l,0.8,i);
    if(/PASSIVAT|NDT|PENETRANT|MAGNETIC PARTICLE|X-?RAY|SHOT PEEN|HELICOIL|LOCTITE|NO TOOL MARKS|REMOVE ALL BURRS|BREAK (?:ALL )?(?:SHARP )?EDGES|CLEAN(?:ROOM)?|VACUUM|ELECTROPOLISH|BEAD BLAST|MARK(?:ING)?\s|IDENTIFY|ENGRAVE|BAG AND TAG/i.test(l)){ const prev=tb.special?.v||""; if(!prev.includes(l)) tb.special={v:(prev?prev+"; ":"")+l.slice(0,90),c:0.8,s:"drawing text layer"}; hits.push({k:"special",idx:i}); }
    if(/FAI|FIRST ARTICLE|AS\s?9102|CMM|\bINSPECT|C\s?OF\s?C|CERTIFICATE|CERTS?\b|TRACEAB|DIMENSIONAL REPORT|100%/i.test(l)){ const prev=tb.inspection?.v||""; if(!prev.includes(l)) tb.inspection={v:(prev?prev+"; ":"")+l.slice(0,90),c:0.8,s:"drawing text layer"}; hits.push({k:"inspection",idx:i}); }
    if((m=l.match(/\bRa\s*(\d*\.?\d+)\s*(µm|um|μm|µin|uin|μin|MICRO ?IN\w*)?/i))) set("surface",l.slice(0,80),0.8,i);
    if(!tb.finish&&(m=l.match(/\b(ANODIZE[\w\s,\-]{0,50}|HARD\s*COAT\w*|BLACK\s*OXIDE[\w\s\-]{0,30}|PASSIVATE[\w\s\-]{0,30}|ZINC\s*PLAT\w*[\w\s\-]{0,30}|(?:ELECTROLESS\s*)?NICKEL\s*PLAT\w*[\w\s\-]{0,30}|CHEM\s*FILM[\w\s\-]{0,40}|ALODINE[\w\s\-]{0,30}|CHROMATE\s*CONVERSION[\w\s\-]{0,40}|POWDER\s*COAT[\w\s\-]{0,30}|MIL-DTL-5541[\w\s,\-]{0,30}|MIL-A?-?(?:PRF-)?8625[\w\s,\-]{0,30})/i))) set("finish",m[1],0.75,i);

    const reBi=/(\d*\.?\d+)\s*\(?\s*\+\s*(\d*\.?\d+)\s*\/\s*-?\s*(\d*\.?\d+)\)?/g; while((m=reBi.exec(l))) tols.push({type:"dimension",callout:l.slice(0,70),tol:`+${m[2]}/-${m[3]}`,c:0.8,idx:i});

    if(gs||gw) tols.push({type:"gdt",gdt:(gs||gw)[1],callout:l.slice(0,80),tol:"",c:gs?0.85:0.6,idx:i});

/* ================= COMPLEXITY ================= */
function rulesComplexity(p,A){
  let s=0; const why=[];
  const f=A.features; if(f>25){s+=2;why.push(f+" features");} else if(f>10){s+=1;why.push(f+" features");}
  if(A.tight.length){ s+=A.tight.length>4?2:1; why.push(A.tight.length+" tolerances ±.001 or tighter"); }
  if(A.gdt.length){ s+=A.gdt.length>3?2:1; why.push(A.gdt.length+" GD&T callouts"); }
  if(A.exotic){ s+=2; why.push((A.mat?.name||"exotic")+" material"); }
  if(A.deepHoles){ s+=1; why.push(A.deepHoles+" deep holes >6×D"); }
  if(A.setups>3){ s+=1; why.push(A.setups+" setups"); }
  if(A.raMin&&A.raMin<=32){ s+=1; why.push("Ra "+Math.round(A.raMin)+" µin finish"); }
  const g=getGeom(p); if(g&&g.T&&g.T<0.06){ s+=1; why.push("thin section "+g.T.toFixed(3)+" in"); }
  const level=s>=6?"Very High":s>=4?"High":s>=2?"Medium":"Standard";
  return {level,reason:why.length?why.join(", "):"simple geometry, standard tolerances",src:"rules",conf:0.6,score:s};
}

function cxSuggestion(p,A){ const cx=p.complexity||{level:"Standard"}; if(cx.src==="manual") return null;
  const s=p.cxSuggest||(A?rulesComplexity(p,A):null); if(!s||!s.level||s.level===cx.level||s.level==="Standard") return null;
  if(p.cxDismissed===s.level) return null; return s; }

  st.jobs=st.jobs||{prefix:"JOB-",next:1001}; if(!Array.isArray(st.portals)) st.portals=[{id:"pt_vendra",name:"Vendra",url:"https://supplier-portal.gov.vendra.io/portal",senders:"vendra.io",customer:""}]; st.followup=st.followup||{amber:3,red:7}; return st; }

/* ================= TIME FORMULAS ================= */
function machiningShare(p){ const n=p.ops.filter(o=>OPT[o.type]?.cat==="mach"&&!["grind","hone","drill","wedm"].includes(o.type)).length; return n||1; }
function formulaTimes(type,p,A,opts={}){
  const T=S.settings.time, g=getGeom(p), mat=A.mat, mrr=(mat?.mrr||1.0), cx=cxMult(p);
  const lines=[]; let prog=0,setup=0,cycle=0;
  const m=ensureMaterial(p); const bv=blankVol(m); const pv=g?.vol||(bv*0.5); const removal=Math.max(0,bv-pv);
  const share=opts.share||1, area=g?.area||(g?2*(g.L*g.W+g.L*g.T+g.W*g.T):20);
  const cat=OPT[type]?.cat;
  if(type==="saw"){ const cuts=1; const sec=(m.form==="round"?Math.PI*Math.pow(num(m.blank.D)/2,2):num(m.blank.W)*num(m.blank.T))||2; const rate=A.exotic?1.0:mat?.family==="aluminum"?8:3; cycle=sec/rate*cuts+0.5; setup=10; lines.push(`cut section ${sec.toFixed(2)} in² ÷ ${rate} in²/min + 0.5 min handling = ${cycle.toFixed(2)} min/pc`); }
  else if(type==="waterjet"){ const perim=g?2*(g.L+g.W):12; const th=g?.T||0.5; const ipm=Math.max(1,(A.exotic?6:mat?.family==="aluminum"?18:8)/Math.max(0.25,th)); cycle=perim/ipm+0.5; setup=15; prog=10; lines.push(`perimeter ${perim.toFixed(1)} in ÷ ${ipm.toFixed(1)} ipm (${th.toFixed(3)} in thick) + 0.5 min = ${cycle.toFixed(2)} min/pc`); }
  else if(type==="precut"){ cycle=0; setup=0; lines.push("blank purchased cut to size: no shop time"); }
  else if(cat==="mach"&&!["grind","hone","drill","wedm","sheet"].includes(type)){
    const rough=removal/share/mrr; const fin=area/share*T.finish_sqin/(mat?.mach||1);
    const holes=A.holes/share*T.hole_min, thr=A.threads/share*T.thread_min, feat=Math.max(0,(A.features-A.holes-A.threads))/share*T.feat_min;
    const tools=Math.max(4,Math.round(6+A.features/share/2)); const tc=tools*T.tool_change;
    const tightAdd=A.tight.length?fin*0.5:0; const raAdd=A.raMin&&A.raMin<=32?fin*0.4:0;
    const exo=A.exotic?1.25:1;
    cycle=(rough+fin+tightAdd+raAdd+holes+thr+feat+tc)*exo+T.handling;
    setup=T.setup_min+A.gdt.length*10/share+(A.tight.length?10:0);
    prog=T.prog_base/share+A.features/share*T.prog_feat+T.prog_setup;
    lines.push(`removal (blank ${bv.toFixed(2)} − part ${pv.toFixed(2)}${g?.vol?"":" est. 50%"}) = ${removal.toFixed(2)} in³ ÷ ${share} op(s) ÷ MRR ${mrr} in³/min = rough ${rough.toFixed(2)} min`);
    lines.push(`finish: area ${area.toFixed(1)} in² ÷ ${share} × ${T.finish_sqin} min/in² ÷ machinability ${mat?.mach||1} = ${fin.toFixed(2)} min${tightAdd?` + tight-tol passes ${tightAdd.toFixed(2)}`:""}${raAdd?` + fine finish ${raAdd.toFixed(2)}`:""}`);
    lines.push(`features: holes ${holes.toFixed(2)} + threads ${thr.toFixed(2)} + other ${feat.toFixed(2)} + ${tools} tool changes × ${T.tool_change} = ${tc.toFixed(2)} min`);
    lines.push(`${exo>1?"× 1.25 exotic-material speeds ":""}+ ${T.handling} min handling = ${cycle.toFixed(2)} min/pc`);
    lines.push(`setup ${T.setup_min} min${A.gdt.length?` + ${A.gdt.length} GD&T × 10 ÷ ${share}`:""}${A.tight.length?" + 10 tight-tol":""} = ${setup.toFixed(0)} min; programming ${prog.toFixed(0)} min`);
  }
  else if(type==="drill"){ cycle=A.holes*0.5+A.threads*0.8+1; setup=20; prog=10; lines.push(`${A.holes} holes × 0.5 + ${A.threads} threads × 0.8 + 1 = ${cycle.toFixed(2)} min/pc`); }
  else if(type==="wedm"){ const perim=g?2*(g.L+g.W):8; const th=g?.T||0.5; cycle=perim*th/0.15+5; setup=30; prog=20; lines.push(`cut area ${(perim*th).toFixed(2)} in² ÷ 0.15 in²/min + 5 = ${cycle.toFixed(1)} min/pc`); }
  else if(type==="grind"||type==="hone"){ cycle=Math.max(4,area*0.08); setup=30; lines.push(`ground area est. ${area.toFixed(1)} in² × 0.08 min/in² (min 4) = ${cycle.toFixed(1)} min/pc`); }
  else if(type==="sheet"){ cycle=4; setup=20; prog=15; lines.push("sheet metal default 4 min/pc"); }
  else if(type==="deburr"){ cycle=T.deburr_base+area*T.deburr_sqin*(A.noToolMarks?2:1); setup=0; lines.push(`${T.deburr_base} min + ${area.toFixed(1)} in² × ${T.deburr_sqin}${A.noToolMarks?" × 2 (no tool marks)":""} = ${cycle.toFixed(2)} min/pc`); }
  else if(type==="mark"){ cycle=1; setup=10; lines.push("1 min/pc marking, 10 min setup"); }
  else if(type==="clean"){ cycle=A.clean?3:1; setup=0; lines.push((A.clean?"precision clean 3":"wash 1")+" min/pc"); }
  else if(type==="assembly"){ cycle=num(p.assembly?.labor_min,10); setup=10; lines.push("assembly labor from the Assembly step"); }
  return {prog:r2(prog),setup:r2(setup),cycle:r2(cycle),math:lines.join("\n")+(cat==="mach"?`\ncomplexity ${p.complexity?.level||"Medium"} × ${cx} is applied to programming, setup and cycle in the cost`:""),cx};
}

  <div class="flist" id="c-list"></div></div>

  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); addFiles([...e.dataTransfer.files]); };
  el.querySelector("#c-go").onclick=async()=>{
    const btn=el.querySelector("#c-go"); btn.disabled=true; const msg=el.querySelector("#c-msg");

    if(R.v==="rfq"&&R.rid===r.id) softRender();
  };
}

  return r.quotes.find(q=>q.no===qno); }

function calcMap(r,p){

  const cs=p.qtys.map(q=>costPart(r,p,q)); const c=cs[qi];
  const mtag=k=>c.ovr.includes(k)?` <span class="cxb">manual</span>`:"";
  const sb=(k,html)=>`<button type="button" class="sumbtn" data-sumpop="${k}" title="Type a price to use instead">${html}${ic("pencil","s")}</button>`;
  out["sum-material"]=p.kind==="assembly"?money(c.material):`<button type="button" class="sumbtn" data-mkpop="1" title="Edit the material price and markup for this part">${matCalc(p,Q).manual?`<span class="cxb">manual</span> `:""}${money(c.material)}${ic("pencil","s")}</button>`; out["sum-ops"]=sb("ops",(c.ovr.includes("ops")||p.ops.some(o=>o.manual_price!=null&&o.manual_price!=="")?`<span class="cxb">manual</span> `:"")+money(c.ops)); out["sum-insp"]=sb("insp",mtag("insp").trim()+" "+money(c.insp)); out["sum-outside"]=sb("out",mtag("out").trim()+" "+money(c.outside)); out["sum-asm"]=sb("asm",mtag("asm").trim()+" "+money(c.asm)); out["sum-pack"]=sb("pack",mtag("pack").trim()+" "+money(c.pack)); out["sum-ship"]=sb("ship",money(c.ship));
  out["sum-price"]=sb("price",c.finalManual?`<span class="cxb">your price</span> ${money(c.unit)}/pc`:`<span class="cxq">estimate</span> ${money(c.unit)}/pc`);
  for(const x of cs){ const k=x.Q; out["fpe-"+k]=money(x.estUnit); out["fpet-"+k]=money(x.estTotal); out["fpt-"+k]=`<b>${money(x.total)}</b>`;
    const d=x.estTotal?(x.total-x.estTotal)/x.estTotal*100:0; out["fpd-"+k]=x.finalManual?`<span class="${d<-0.5?"neg":d>0.5?"pos":"mute"}">${d>0?"+":""}${d.toFixed(1)}%</span>`:`<span class="mute">—</span>`; }
  out["sum-total"]=`<button type="button" class="sumbtn" data-sumpop="price" title="Type your own price per piece">${c.finalManual?`<span class="cxb">your price</span> `:""}${money(c.unit)}/pc @ ${Q}${ic("pencil","s")}</button>`; out["sum-cx"]=(()=>{ const lv=p.complexity?.level||"Standard", m=cxMult(p), sg=cxSuggestion(p,A); return (m!==1?`<span class="cxb">${esc(lv)} ${m}×</span>`:`<span class="cxq">${esc(lv)} 1×</span>`)+(sg?` <span class="pill blue" style="height:18px">suggestion</span>`:""); })();
  out["foot"]=`<span class="small mute">Total</span><b>${money(c.total)}</b><span class="small mute">Unit</span><b>${money(c.unit)}</b>${c.min?'<span class="pill or">min order</span>':""}${c.finalManual?'<span class="pill or">your price</span>':""}${p.rush?'<span class="pill red">rush</span>':""}`;
  out["qtyt"]=`<div class="brk" style="--n:${p.qtys.length}"><div class="h">Quantity</div>${cs.map(x=>`<div class="h r">${x.Q}</div>`).join("")}<div>Per unit</div>${cs.map(x=>`<div class="r">${money(x.unit)}</div>`).join("")}<div>Total</div>${cs.map(x=>`<div class="r">${money(x.total)}</div>`).join("")}<div>Lead time</div>${cs.map(()=>`<div class="r">${leadDays(p)} d</div>`).join("")}</div>`;

    if(k.linked){ const lc=t.link==="inspection"?c.insp:t.link==="packaging"?c.pack:(()=>{ const x=(p.outside||[]).find(x=>x.id===o.procId); return x?outCost(x,p,Q).total:0; })(); out["op-"+o.id]=`${money(lc)}<small>in ${t.link==="outside"?"outside":t.link}</small>`; out["om-"+o.id]=`Costed in the ${t.link==="outside"?"Outside processes":t.link==="inspection"?"Inspection":"Packaging"} step.`; }
    else { out["op-"+o.id]=`${money(k.total)}<small>${k.manual?"manual · ":""}${money(k.unit)}/pc</small>`; out["om-"+o.id]=esc(k.math)+(o.aiMath?`\n\nformula basis:\n${esc(o.aiMath)}`:o.ai&&o.src==="Claude"?`\n\nminutes estimated by Claude from the drawing; formula reference:\n${esc(formulaTimes(o.type,p,A,{share:machiningShare(p)}).math)}`:`\n\nformula reference:\n${esc(formulaTimes(o.type,p,A,{share:machiningShare(p)}).math)}`); } }
  for(const x of p.outside||[]){ const k=outCost(x,p,Q); out["x-"+x.id]=money(k.total); out["xm-"+x.id]=esc(`${k.math}${x.basis!=="lot"&&num(x.min_batch)>0?` (minimum lot charge ${money(num(x.min_batch))})`:""}\n+ freight ${money(num(x.ship_to))} to vendor + ${money(num(x.ship_from))} back\n+ ${lineMk(p,"out").on?lineMk(p,"out").pct+"% markup":"no markup on this line"} ${money(k.mk)}\n= ${money(k.total)} for ${Q} pcs (${money(k.total/Q)}/pc)`); }
  const ic2=inspCost(p,Q); out["insp"]=`Manual ${money(ic2.manual)} · CMM ${money(ic2.cmm)} · FAI ${money(ic2.fai)} · Certs ${money(ic2.cert)} = <b>${money(ic2.total)}</b> for ${Q} pcs`;

   ${[["Material","material"],["Operations","ops"],["Outside processes","outside"],["Hardware / assembly","asm"],["Inspection","insp"],["Packaging","pack"],["Shipping","ship"],["Subtotal","sub"],[`Overhead ${S.settings.overhead_pct}%`,"oh"],[lineMk(p,"final").on?`Final markup ${lineMk(p,"final").pct}%`:"Final markup (off)","mk"],["Rush","rush"]].filter(([,k])=>k!=="rush"||p.rush).map(([l,k])=>`<div>${l}</div>${cs.map(x=>`<div class="r">${money(x[k])}</div>`).join("")}`).join("")}
   <div class="t">Total</div>${cs.map(x=>`<div class="r t">${money(x.total)}${x.min?"*":""}</div>`).join("")}<div class="t">Unit price</div>${cs.map(x=>`<div class="r t">${money(x.unit)}</div>`).join("")}<div>Lead time</div>${cs.map(()=>`<div class="r">${leadDays(p)} d</div>`).join("")}</div>${cs.some(x=>x.min)?`<div class="tiny mute">* raised to the ${money(S.settings.min_order)} minimum order charge</div>`:""}`;
  return out;

function computeFlags(p,lines){
  const A=analyze(p); const want=[];
  if(A.tightest) want.push({label:"Tightest Tolerances",text:A.tightest.callout});
  for(const t of A.tight.slice(0,4)) if(t!==A.tightest) want.push({label:"Tight Tolerance",text:t.callout});
  for(const t of A.gdt.slice(0,5)) want.push({label:"GD&T "+(t.gdt?t.gdt[0].toUpperCase()+t.gdt.slice(1):""),text:t.callout});
  if(p.tb.finish?.v) want.push({label:"Finish Spec",text:p.tb.finish.v});
  if(p.tb.heat_treat?.v) want.push({label:"Heat Treat",text:p.tb.heat_treat.v});
  for(const f of p.flags||[]) if(!want.some(w=>w.label.toLowerCase()===String(f.label).toLowerCase())) want.push(f);
  const norm=s=>String(s||"").toUpperCase().replace(/\s+/g," ").trim();
  const out=[], unplaced=[], used=new Set();
  for(const w of want){ const key=norm(w.text).slice(0,18); if(!key) continue; const L=lines.find(l=>l.x!=null&&!used.has(l)&&(norm(l.t).includes(key)||key.includes(norm(l.t))&&norm(l.t).length>5));
    if(L){ used.add(L); out.push({...w,x:L.x,y:L.y,w:L.w,h:L.h}); } else if(!unplaced.find(u=>u.label===w.label)&&!out.find(o=>o.label===w.label)) unplaced.push(w); }
  for(let i=unplaced.length-1;i>=0;i--) if(out.find(o=>o.label===unplaced[i].label)) unplaced.splice(i,1);
  return {out,unplaced};
}
function placeFlags(wrap,p,lines,rot){
  const {out,unplaced}=computeFlags(p,lines);
  const tr=(x,y)=>rot===90?[1-y,x]:rot===180?[1-x,1-y]:rot===270?[y,1-x]:[x,y];
  const placed=[];
  for(const f of out){ const [x,y]=tr(f.x,f.y); const hl=document.createElement("div"); hl.className="hl"; const [x2,y2]=tr(f.x+(f.w||0.05),f.y+(f.h||0.015));
    hl.style.left=Math.min(x,x2)*100+"%"; hl.style.top=Math.min(y,y2)*100+"%"; hl.style.width=Math.abs(x2-x)*100+"%"; hl.style.height=Math.abs(y2-y)*100+"%"; wrap.appendChild(hl);
    const c=document.createElement("div"); c.className="flag"; c.textContent=f.label; c.title=f.text; let cx=Math.min(x,x2), cy=Math.min(y,y2); while(placed.some(([px,py])=>Math.abs(px-cx)<0.14&&Math.abs(py-cy)<0.035)) cy-=0.04; placed.push([cx,cy]); c.style.left=cx*100+"%"; c.style.top=cy*100+"%"; wrap.appendChild(c); }
  if(unplaced.length){ const box=document.createElement("div"); box.style.cssText="position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:60%"; for(const f of unplaced.slice(0,6)){ const c=document.createElement("div"); c.className="flag"; c.style.position="static"; c.style.transform="none"; c.textContent=f.label+": "+String(f.text).slice(0,40); c.title=f.text; box.appendChild(c); } wrap.appendChild(box); }
}

/* Customer breakdown: one row per quote line, totals only. Overhead, markups, rush and your own price are spread
   across the lines in proportion, so each column adds up exactly to the quoted price. No machines, vendors or rates. */
function breakdownData(r){ const out=[];
  for(const l of quoteLines(r)){ if(l.noBid) continue; const p=l.p;
    const mat=findMaterial(p.material?.code);
    const opNames=[...new Set(p.ops.filter(o=>OPT[o.type]?.cat!=="link").map(o=>String(o.name||OPT[o.type]?.n||"").replace(/\s*\b(OP|Op|op)\s*\d+\b/g,"").replace(/\s{2,}/g," ").trim()).filter(Boolean))];
    const outNames=(p.outside||[]).map(x=>[x.name,x.spec].filter(Boolean).join(" ")).filter(Boolean);
    const defs=[["material","Material",p.kind==="assembly"?"":[mat?.name||p.tb?.material?.v||"",p.material?.certs?"certs included":""].filter(Boolean).join(", ")],
      ["ops","Machining and finishing operations",opNames.join(", ")],["outside","Outside processes",outNames.join(", ")],
      ["asm","Hardware and assembly",(p.assembly?.hardware||[]).length?`${(p.assembly.hardware||[]).length} hardware item(s)`:""],
      ["insp","Inspection and certification",[p.inspection?.fai?"first article (AS9102)":"",p.inspection?.cert_pkg?"cert package":""].filter(Boolean).join(", ")],
      ["pack","Packaging",""],["ship","Shipping",p.shipping?.method||""]];
    const cols=l.breaks.map(c=>{ const raw=defs.map(([k])=>Math.max(0,num(c[k]))); const sum=raw.reduce((a,b)=>a+b,0);
      const f=sum>0?c.total/sum:0; const v=raw.map(x=>Math.round(x*f*100)/100); const diff=Math.round((c.total-v.reduce((a,b)=>a+b,0))*100)/100;
      if(sum>0){ let i=v.length-1; while(i>0&&!v[i]) i--; v[i]=Math.round((v[i]+diff)*100)/100; }
      return {Q:c.Q,total:c.total,unit:c.unit,v,blank:sum<=0}; });
    const rows=defs.map(([k,label,detail],i)=>({label,detail,vals:cols.map(c=>c.v[i])})).filter(rw=>rw.vals.some(v=>v>0.004));
    out.push({p,cols,rows}); }
  return out; }

  para([s.assumptions,...new Set(ql.map(l=>l.p.notes.assumptions).filter(Boolean))].join(" "),"Assumptions"); para(s.terms,"Terms"); if(sh.itar) para(s.itar_note,"ITAR");
  if(r.quoteBreakdown){ const B=breakdownData(r);

      d.setFont("helvetica","bold"); d.setFontSize(14); d.text("Quote breakdown",M,y+14); d.setFontSize(9); d.setFont("helvetica","normal"); d.text(`${qno}  ·  ${r.company||""}  ·  Totals by quote line; each column adds up to the quoted price.`,M,y+28); y+=48;

        b.cols.forEach((c,i)=>d.text(`Qty ${c.Q}`,x0+colW*(i+1)-4,y+1,{align:"right"})); y+=20; d.setFont("helvetica","normal");
        for(const rw of b.rows){ d.setFont("helvetica","bold"); d.text(rw.label,M+4,y); d.setFont("helvetica","normal");

          y+=8; d.setDrawColor(229,231,235); d.setLineWidth(0.5); d.line(M,y-2,W-M,y-2); y+=10; }
        d.setFont("helvetica","bold"); d.text("Total",M+4,y); b.cols.forEach((c,i)=>d.text(money(c.total),x0+colW*(i+1)-4,y,{align:"right"})); y+=13;
        d.setFont("helvetica","normal"); d.setTextColor(90); d.text("Per piece",M+4,y); b.cols.forEach((c,i)=>d.text(money(c.unit),x0+colW*(i+1)-4,y,{align:"right"})); d.setTextColor(20); y+=26; } } }

function csvCell(v){ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }
function costingCSV(r,parts){
  const rows=[["RFQ","Part","Rev","Description","Qty","Material","Operations","Inspection","Outside","Assembly","Packaging","Shipping","Subtotal","Overhead","Markup","Rush","Total","Unit"]];
  for(const p of parts){ if(p.kind==="purchased"&&!p.parentId) continue; for(const q of p.qtys){ const c=costPart(r,p,p.parentId?q*num(p.qtyPer,1):q); rows.push([r.number,p.part_number,p.rev,p.description,c.Q,...["material","ops","insp","outside","asm","pack","ship","sub","oh","mk","rush","total","unit"].map(k=>r2(c[k]))]); } }
  rows.push([]); rows.push(["RFQ","Part","Op #","Operation","Machine","Prog min","Setup min","Cycle min","Rate $/h","Cost @ first qty","AI estimated","Why"]);
  for(const p of parts){ const A=analyze(p); p.ops.forEach((o,i)=>{ const k=opCost(o,p,p.qtys[0]||1,A); rows.push([r.number,p.part_number,(i+1)*10,o.name,S.machines.find(m=>m.id===o.machineId)?.name||"",o.prog_min,o.setup_min,o.cycle_min,k.linked?"":opRate(o),k.linked?"(see section)":r2(k.total),o.ai?"yes":"no",o.why||""]); }); }
  return rows.map(r=>r.map(csvCell).join(",")).join("\n");
}
function exportRfqMenu(r,anchor){ const p=openPop(anchor,`<button class="mi" data-e="csv">${ic("download","s")}Costing breakdown (CSV for Excel)</button><button class="mi" data-e="json">${ic("json","s")}RFQ data (JSON)</button><button class="mi" data-e="q" ${quotableParts(r).every(partReady)?"":"disabled"}>${ic("quote","s")}Quote document</button>`);
  p.onclick=e=>{ const b=e.target.closest("[data-e]"); if(!b) return; closePop(); if(b.dataset.e==="csv") saveDownload(`${r.number}_costing.csv`,costingCSV(r,orderedParts(r))); if(b.dataset.e==="json") saveDownload(`${r.number}.json`,JSON.stringify(r,null,1)); if(b.dataset.e==="q") quoteOutput(r); }; }

/* ================= ORDERS (board / jobs / machines) ================= */
const JOB_STATUS=["Released","Material ordered","In process","Outside process","Inspection","Shipped","Lost"];
const CLOSED=["Shipped","Lost"], OFFMACH=["Inspection","Outside process"];
const isOpenJob=o=>!CLOSED.includes(o.status);
const r1=v=>Math.round((v||0)*10)/10;
function todayISO(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function dayDate(iso){ const d=new Date(String(iso).slice(0,10)+"T00:00:00"); return isNaN(d)?null:d; }
function fmtDay(iso){ const d=dayDate(iso); return d?`${MON[d.getMonth()]} ${d.getDate()}`:""; }
function daysTo(iso){ const a=dayDate(iso), b=dayDate(todayISO()); return a&&b?Math.round((a-b)/864e5):null; }
function dueCls(o){ if(!o.due||!isOpenJob(o)) return ""; const d=daysTo(o.due); return d==null?"":d<0?"late":d<=3?"soon":""; }
function dueTxt(o){ if(!o.due) return ""; const d=daysTo(o.due); if(!isOpenJob(o)||d==null) return "due "+fmtDay(o.due); return d<0?`${-d}d overdue`:d===0?"due today":d===1?"due tomorrow":"due "+fmtDay(o.due); }
const machById=id=>id?S.machines.find(m=>m.id===id)||null:null;
function machIcon(m){ return m.kind==="lathe"||m.kind==="livetool"||m.kind==="swiss"?"lathe":m.kind==="saw"?"saw":m.kind==="waterjet"?"water":m.kind==="cmm"?"insp":"mill"; }

/* ---- a job is a list of operations; each operation sits in one machine's queue ----
   op: {id, n, name, machineId|null, state:"queued"|"running"|"done", queuePos, hours} */
function normJob(o){ if(Array.isArray(o.ops)) return false;
  o.ops=[]; if(o.machineId) o.ops.push({id:o.id+"-op1",n:1,name:"Op 1",machineId:o.machineId,state:o.running?"running":"queued",queuePos:o.queuePos??null,hours:o.est_hours??null});
  delete o.machineId; delete o.running; delete o.queuePos; return true; }
const liveOps=o=>(o.ops||[]).filter(op=>op.state!=="done");
const placedOps=o=>liveOps(o).filter(op=>machById(op.machineId));
const opHours=(o,op)=>op.hours!=null&&op.hours!==""?num(op.hours):(num(o.est_hours)/Math.max(1,(o.ops||[]).length));
function lane(mid){ const es=[]; for(const o of S.orders){ if(!isOpenJob(o)) continue; for(const op of o.ops||[]) if(op.machineId===mid&&op.state!=="done") es.push({o,op}); }
  const run=es.find(e=>e.op.state==="running")||null;
  const q=es.filter(e=>e!==run).sort((a,b)=>(a.op.queuePos??1e9)-(b.op.queuePos??1e9)||String(a.o.due||"9999").localeCompare(String(b.o.due||"9999"))||String(a.o.number).localeCompare(String(b.o.number)));
  return {run,q,hours:q.reduce((s,e)=>s+opHours(e.o,e.op),0)}; }
function ensureQueues(){
  for(const o of S.orders){ let ch=normJob(o);
    for(const op of o.ops){ if(op.machineId&&!machById(op.machineId)){ op.machineId=null; op.state=op.state==="done"?"done":"queued"; ch=true; } if(!op.machineId&&op.state==="running"){ op.state="queued"; ch=true; } }
    if(isOpenJob(o)&&o.status==="Released"&&placedOps(o).length){ o.status="In process"; ch=true; }
    if(ch) touchOrder(o); }
  for(const m of S.machines){ const es=[]; for(const o of S.orders) if(isOpenJob(o)) for(const op of o.ops) if(op.machineId===m.id&&op.state!=="done") es.push({o,op});
    if(!es.length) continue; const runs=es.filter(e=>e.op.state==="running"); runs.slice(1).forEach(e=>{ e.op.state="queued"; e.op.queuePos=-1; touchOrder(e.o); });
    lane(m.id).q.forEach((e,i)=>{ if(e.op.queuePos!==i){ e.op.queuePos=i; touchOrder(e.o); } }); } }
function opPlace(o,op){ if(op.state==="done") return "Done"; const m=machById(op.machineId); if(!m) return "Unassigned"; const L=lane(m.id);
  if(L.run&&L.run.op===op) return "Running"; const i=L.q.findIndex(e=>e.op===op); return i<0?"":`#${i+(L.run?2:1)} in queue`; }
function queueLabel(o){ if(!isOpenJob(o)) return ""; const ps=placedOps(o);
  if(!ps.length) return OFFMACH.includes(o.status)?"Off machine":(o.ops||[]).length&&!liveOps(o).length?"All ops done":"Unassigned";
  const run=ps.find(op=>op.state==="running"); if(ps.length===1) return `${opPlace(o,ps[0])} · ${machById(ps[0].machineId).name}`;
  return run?`Running on ${machById(run.machineId).name} +${ps.length-1}`:`Queued on ${ps.length} machines`; }
function boardMachines(){ return S.machines.filter(m=>m.active||S.orders.some(o=>isOpenJob(o)&&(o.ops||[]).some(op=>op.machineId===m.id&&op.state!=="done"))); }
/* assign (or move) an operation to a machine. Without opId: reuse an unassigned op of the job, else add a new op. */
function assignOp(o,mid,{opId=null,idx=null,run=false}={}){
  normJob(o); let op=opId?o.ops.find(x=>x.id===opId):null;
  if(!op) op=liveOps(o).find(x=>!machById(x.machineId))||null;
  if(!op){ const n=Math.max(0,...o.ops.map(x=>num(x.n)))+1; op={id:uid("j"),n,name:`Op ${n}`,machineId:null,state:"queued",queuePos:null,hours:null}; o.ops.push(op); }
  const L=lane(mid);
  if(run){ if(L.run&&L.run.op!==op){ L.run.op.state="queued"; L.run.op.queuePos=-1; touchOrder(L.run.o); } op.machineId=mid; op.state="running"; op.queuePos=null; }
  else { const q=L.q.filter(e=>e.op!==op); if(L.run&&L.run.op===op) op.state="queued"; const i=Math.max(0,Math.min(idx==null?q.length:idx,q.length)); q.splice(i,0,{o,op});
    op.machineId=mid; if(op.state!=="running") op.state="queued"; q.forEach((e,k)=>{ if(e.op.queuePos!==k){ e.op.queuePos=k; touchOrder(e.o); } }); }
  if(isOpenJob(o)) o.status="In process";
  touchOrder(o); ensureQueues(); return op; }
function unassignOp(o,op){ op.machineId=null; op.state="queued"; op.queuePos=null; if(!placedOps(o).length&&o.status==="In process") o.status="Released"; touchOrder(o); ensureQueues(); }
function removeOp(o,op){ o.ops=o.ops.filter(x=>x!==op); if(!placedOps(o).length&&o.status==="In process") o.status="Released"; touchOrder(o); ensureQueues(); }
function setJobStatus(o,s){ o.status=s; if(s==="Shipped"&&!o.shipped_at) o.shipped_at=todayISO(); touchOrder(o); ensureQueues(); }
function startNext(mid){ const L=lane(mid); if(L.run) return; const e=L.q[0]; if(!e){ toast("Nothing queued on this machine."); return; } assignOp(e.o,mid,{opId:e.op.id,run:true}); toast(`${e.o.number} Op ${e.op.n} started on ${machById(mid)?.name||"machine"}`); }
/* complete the running op; the next op in that machine's queue moves up. When the job has no ops left, ask what happens to it. */
function completeOp(o,op,anchor,redraw=render){ const mid=op.machineId; op.state="done"; op.doneAt=todayISO(); op.queuePos=null; touchOrder(o);
  const L=mid?lane(mid):null; const nx=L&&!L.run?L.q[0]:null; if(nx) assignOp(nx.o,mid,{opId:nx.op.id,run:true}); else ensureQueues();
  const msg=`${o.number} Op ${op.n} complete.${nx?` ${nx.o.number} Op ${nx.op.n} is now running.`:mid?" Machine is idle.":""}`;
  if(liveOps(o).length){ toast(msg+` ${liveOps(o).length} op(s) left on this job.`,4000); redraw(); return; }
  redraw(); toast(msg,3500); lastOpMenu(o,anchor,redraw); }
function lastOpMenu(o,anchor,redraw=render){
  const m=openModal(`<div class="mh"><h2>${esc(o.number)}: all operations complete</h2></div><div class="mb"><div class="small ink2">Every operation on <b>${esc(o.number)}</b> (${esc(o.part||"")}) is complete. What's next for this job?</div>
   <div class="lastops">${[["Inspection","insp"],["Outside process","out"],["Shipped","ship"]].map(([s,i])=>`<button class="btn" data-ls="${s}">${ic(i,"s")}${s}</button>`).join("")}<button class="btn ghost" data-ls="">Keep In process</button></div></div>`);
  m.el.addEventListener("click",e=>{ const b=e.target.closest("[data-ls]"); if(!b) return; m.close(); if(b.dataset.ls){ setJobStatus(o,b.dataset.ls); toast(`${o.number} → ${b.dataset.ls}`); } redraw(); }); }

function opCardHTML(o,op,{pos=null,lead=false,running=false}={}){ const dc=dueCls(o); const many=(o.ops||[]).length>1;
  return `<div class="${running?"jc":"qc"} ${dc} ${running?"isrun":""}" draggable="true" data-job="${o.id}" data-op="${op.id}" tabindex="0" title="${esc(o.number)} Op ${op.n} · ${esc(o.part||"")}. Click for details, drag to move, Enter for the move menu.">
   <div class="jt"><b class="mono">${esc(o.number)}</b><span class="opn">Op ${op.n}${many?`/${o.ops.length}`:""}</span>${pos?`<span class="qpos">#${pos}</span>`:""}</div>
   <div class="jp">${esc(o.part||"(no part)")}</div>
   <div class="jm">${op.name&&op.name!==`Op ${op.n}`?esc(op.name)+" · ":""}${esc(o.customer||"")}${o.qty?` · ${o.qty} pcs`:""} · ${r1(opHours(o,op))} h</div>
   <div class="jf">${o.due?`<span class="due ${dc}">${esc(dueTxt(o))}</span>`:""}<span class="grow"></span>${lead?`<button class="btn sm pri" data-start="${op.machineId}">${ic("play","s")}Start</button>`:""}${running?`<button class="btn sm" data-complete="${o.id}|${op.id}">${ic("ok","s")}Complete</button>`:""}</div></div>`; }
function jobCardHTML(o){ const dc=dueCls(o); const un=liveOps(o).filter(op=>!machById(op.machineId));
  return `<div class="jc ${dc}" draggable="true" data-job="${o.id}" tabindex="0" title="${esc(o.number)} · ${esc(o.part||"")}. Drag onto a machine to queue it.">
   <div class="jt"><b class="mono">${esc(o.number)}</b>${un.length?`<span class="opn">${un.length} op${un.length>1?"s":""} to place</span>`:""}</div>
   <div class="jp">${esc(o.part||"(no part)")}</div>
   <div class="jm">${esc(o.customer||"")}${o.qty?` · ${o.qty} pcs`:""}${o.est_hours?` · ${r1(o.est_hours)} h`:""}</div>
   <div class="jf"><span class="pill ${o.status==="In process"?"blue":""}">${esc(o.status)}</span>${o.due?`<span class="due ${dc}">${esc(dueTxt(o))}</span>`:""}</div></div>`; }

function boardHTML(open){
  const un=open.filter(o=>!placedOps(o).length&&!OFFMACH.includes(o.status)&&!((o.ops||[]).length&&!liveOps(o).length));
  const off=open.filter(o=>!placedOps(o).length&&(OFFMACH.includes(o.status)||((o.ops||[]).length&&!liveOps(o).length)));

     return `<div class="lane" data-lane="${m.id}">

      <div class="run" data-drop="run:${m.id}"><div class="lab">${L.run?`${ic("play","s")}Running`:"Idle"}</div>${L.run?opCardHTML(L.run.o,L.run.op,{running:true}):`<div class="idle">${L.q.length?"Press Start on the next job,<br>or drop a job here":"Drop a job here to run it now"}</div>`}</div>
      <div class="q" data-drop="q:${m.id}"><div class="lab">Queue${L.q.length?` · ${L.q.length}`:""}</div><div class="qrow">${L.q.map((e,i)=>opCardHTML(e.o,e.op,{pos:i+(L.run?2:1),lead:i===0&&!L.run})).join("")||`<div class="dz">Queue empty. Drop jobs here.</div>`}</div></div></div>`; }).join("")||`<div class="empty">No active machines. Turn machines on in the Machines tab.</div>`}
    <div class="lane off" data-lane="off"><div class="lh"><div class="ln">${ic("insp","s")}<b>Off machine</b></div><div class="ll"><span><b>${off.length}</b> in inspection, outside or done</span></div></div>
     <div class="q wide"><div class="qrow">${off.map(o=>jobCardHTML(o)).join("")||`<div class="dz">Jobs in Inspection or at an outside process, with nothing left on a machine, show here.</div>`}</div></div></div>
   </div></div>`; }

function qIndex(zone,x,skipOp){ const cs=[...zone.querySelectorAll(".qc")].filter(c=>c.dataset.op!==skipOp); let i=0; for(const c of cs){ const b=c.getBoundingClientRect(); if(x>b.left+b.width/2) i++; } return {i,cs}; }
function findOp(jid,oid){ const o=S.orders.find(x=>x.id===jid); return {o,op:o&&oid?(o.ops||[]).find(x=>x.id===oid):null}; }
function wireBoard(){ const B=$("board"); if(!B) return; let dj=null, dop=null;
  const clear=()=>{ B.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); B.querySelectorAll(".ins").forEach(x=>x.remove()); };
  B.addEventListener("dragstart",e=>{ const c=e.target.closest("[data-job]"); if(!c) return; dj=c.dataset.job; dop=c.dataset.op||null; setTimeout(()=>c.classList.add("dragging"),0); try{ e.dataTransfer.setData("text/plain",dj); e.dataTransfer.effectAllowed="move"; }catch(_){} });
  B.addEventListener("dragend",()=>{ dj=null; dop=null; clear(); B.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging")); });
  B.addEventListener("dragover",e=>{ const z=e.target.closest("[data-drop]"); if(!z||!dj) return; e.preventDefault(); if(!z.classList.contains("over")){ clear(); z.classList.add("over"); }
    if(z.dataset.drop.startsWith("q:")){ const {i,cs}=qIndex(z,e.clientX,dop); let ins=z.querySelector(".ins"); if(!ins){ ins=document.createElement("div"); ins.className="ins"; } const row=z.querySelector(".qrow"); if(cs[i]) row.insertBefore(ins,cs[i]); else row.appendChild(ins); } });
  B.addEventListener("dragleave",e=>{ const z=e.target.closest("[data-drop]"); if(z&&!z.contains(e.relatedTarget)){ z.classList.remove("over"); z.querySelector(".ins")?.remove(); } });
  B.addEventListener("drop",e=>{ const z=e.target.closest("[data-drop]"); if(!z||!dj) return; e.preventDefault(); const {o,op}=findOp(dj,dop); const d=z.dataset.drop; dj=null; dop=null; if(!o) return;
    if(d==="u"){ if(op) unassignOp(o,op); }
    else if(d.startsWith("run:")) assignOp(o,d.slice(4),{opId:op?.id,run:true});
    else assignOp(o,d.slice(2),{opId:op?.id,idx:qIndex(z,e.clientX,op?.id).i});
    viewOrders(); });
  B.addEventListener("click",e=>{ const s=e.target.closest("[data-start]"); if(s){ e.stopPropagation(); startNext(s.dataset.start); viewOrders(); return; }
    const f=e.target.closest("[data-complete]"); if(f){ e.stopPropagation(); const [jid,oid]=f.dataset.complete.split("|"); const {o,op}=findOp(jid,oid); if(o&&op) completeOp(o,op,f); return; }

  B.addEventListener("keydown",e=>{ const c=e.target.closest("[data-job]"); if(!c||e.key!=="Enter"||e.target.closest("button")) return; e.preventDefault(); const {o,op}=findOp(c.dataset.job,c.dataset.op); if(o) moveMenu(c,o,op); }); }
function moveMenu(anchor,o,op){ const m=op?machById(op.machineId):null, L=m?lane(m.id):null, qi=L?L.q.findIndex(e=>e.op===op):-1;
  const p=openPop(anchor,`<div class="tiny mute" style="padding:4px 8px">${esc(o.number)}${op?` Op ${op.n}`:""}</div><button class="mi" data-k="open">${ic("pencil","s")}Open details</button>
   ${L&&L.run?.op===op?`<button class="mi" data-k="done">${ic("ok","s")}Complete this op</button>`:""}
   ${qi>0?`<button class="mi" data-k="up">↑ Earlier in queue</button>`:""}${qi>=0&&qi<L.q.length-1?`<button class="mi" data-k="down">↓ Later in queue</button>`:""}
   ${op?`<button class="mi" data-k="u">Take off the machine</button>`:""}<div class="tiny mute" style="padding:6px 8px 2px">${op?"Move to":"Queue on"}</div>

    wireOpsEdit(el,refresh); };
  const close=()=>{ el.remove(); drawerClose=null; modalStack=modalStack.filter(x=>x!==close); };

  paint(); document.body.appendChild(el); modalStack.push(close); drawerClose=close;

    if(e.target.closest("[data-ddel]")){ (async()=>{ if(await confirmBox("Delete job?",`${o.number} is removed from Orders.`,"Delete",true)){ S.orders=S.orders.filter(x=>x!==o); touch("del-order:"+o.id); close(); ensureQueues(); render(); } })(); } });

function jobsHTML(jobs){ const sf=UI.jsf||"All"; const cnt=s=>s==="All"?jobs.length:jobs.filter(o=>o.status===s).length;
  let rows=jobs.filter(o=>sf==="All"||o.status===sf); const sk=UI.jsort;
  if(sk){ const v=o=>sk.k==="number"?String(o.number):sk.k==="customer"?(o.customer||"").toLowerCase():sk.k==="due"?(o.due||"9999"):sk.k==="status"?JOB_STATUS.indexOf(o.status):sk.k==="machine"?(machById(placedOps(o)[0]?.machineId)?.name||"~"):""; rows=[...rows].sort((a,b)=>{ const x=v(a),y=v(b); return (x>y?1:x<y?-1:0)*sk.d; }); }

   <table class="tbl jobs"><thead><tr>${th("number","Job")}${th("customer","Customer")}<th>Part</th><th class="num">Qty</th><th class="num">Unit $</th><th class="num">Est h</th><th class="num">Actual h</th>${th("machine","Machines and operations")}${th("status","Status")}${th("due","Due")}<th></th></tr></thead><tbody>
    ${rows.map(o=>{ const dc=dueCls(o); return `<tr data-jrow="${o.id}" style="cursor:default"><td class="mono"><button class="linkbtn mono" data-jopen="${o.id}" title="Open job details">${esc(o.number)}</button></td><td>${esc(o.customer)}</td><td class="small">${o.rfqId?`<button class="linkbtn" data-jpart="${o.id}" title="Open the drawing (or 3D model)">${ic("file","s")}${esc(o.part||"(part)")}</button>`:esc(o.part)}<div class="tiny mute">${esc(o.material||"")}</div></td><td class="num">${o.qty??""}</td><td class="num">${money(o.unit_price)}</td><td class="num">${o.est_hours??""}</td><td><input class="inp n" data-jf="actual_hours" value="${o.actual_hours??""}" style="height:30px;width:70px"></td>
     <td>${opsEditHTML(o)}</td>
     <td><select class="inp" data-jf="status" style="height:30px;width:140px">${JOB_STATUS.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td><td class="duecell ${dc}"><input class="inp" type="date" data-jf="due" value="${esc(o.due||"")}" style="height:30px;width:140px">${dc?`<div class="tiny">${esc(dueTxt(o))}</div>`:""}</td>
     <td>${o.rfqId?`<button class="btn ghost sm" data-go="rfq-${o.rfqId}">RFQ</button>`:""}<button class="btn ghost sm icon" data-jdel="${o.id}" aria-label="Delete job">${ic("trash","s")}</button></td></tr>`; }).join("")||`<tr><td colspan="11"><div class="empty">No jobs${sf!=="All"?" with this status":""}.</div></td></tr>`}</tbody></table>
    <div class="small mute" style="margin-top:8px">Pick a machine to put the job in that machine's queue; add more machines for more operations. Order the queues on the Board.</div>
    ${calibrationHTML()}</div>`; }

function viewOrders(){
  const tab=UI.otab||"board"; ensureQueues();

  const q=(UI.oq||"").toLowerCase(); const jobs=S.orders.filter(o=>!q||[o.number,o.customer,o.part,o.po].join(" ").toLowerCase().includes(q));

  const oq=$("oq"); oq.oninput=()=>{ UI.oq=oq.value; saveUI(); const p=oq.selectionStart; viewOrders(); $("oq").focus(); $("oq").setSelectionRange(p,p); };
  $("o-new").onclick=()=>{ const o={id:uid("o"),number:nextJobNumber(),customer:"",part:"",qty:1,unit_price:0,status:"Released",ops:[],date:todayISO()}; S.orders.push(o); touchOrder(o); viewOrders(); openJobDrawer(o); };
  wireBoard();
