  document.querySelectorAll("[data-jsf]").forEach(b=>b.onclick=()=>{ UI.jsf=b.dataset.jsf; saveUI(); viewOrders(); });
  document.querySelectorAll("[data-jsort]").forEach(b=>b.onclick=()=>{ const k=b.dataset.jsort; UI.jsort=UI.jsort?.k===k?(UI.jsort.d>0?{k,d:-1}:null):{k,d:1}; saveUI(); viewOrders(); });
  document.querySelectorAll("[data-jopen]").forEach(b=>b.onclick=()=>{ const o=S.orders.find(x=>x.id===b.dataset.jopen); if(o) openJobDrawer(o); });
  document.querySelectorAll("[data-jpart]").forEach(b=>b.onclick=()=>{ const o=S.orders.find(x=>x.id===b.dataset.jpart); if(o) openJobDrawing(o); });
  document.querySelectorAll("[data-jf]").forEach(i=>i.onchange=()=>{ const o=S.orders.find(x=>x.id===i.closest("[data-jrow]").dataset.jrow); const k=i.dataset.jf;
    if(k==="status") setJobStatus(o,i.value); else { o[k]=k==="actual_hours"?(i.value===""?null:num(i.value)):(i.value||null); touchOrder(o); }
    viewOrders(); });
  document.querySelectorAll("[data-jdel]").forEach(b=>b.onclick=async()=>{ if(await confirmBox("Delete job?","The job is removed from Orders.","Delete",true)){ S.orders=S.orders.filter(o=>o.id!==b.dataset.jdel); touch("del-order:"+b.dataset.jdel); ensureQueues(); viewOrders(); } });
  wireMachines();
}

function nextJobNumber(peek){ const j=S.settings.jobs||(S.settings.jobs={prefix:"JOB-",next:1001}); let n=Math.max(1,Math.floor(num(j.next,1001)));
  const used=new Set(S.orders.map(o=>String(o.number).trim().toUpperCase())); const pre=String(j.prefix??"");
  while(used.has((pre+n).toUpperCase())) n++; if(!peek){ j.next=n+1; touchCfg(); } return pre+n; }
function calibrationHTML(){ const done=S.orders.filter(o=>o.est_hours&&o.actual_hours); if(!done.length) return ""; const f=done.reduce((s,o)=>s+o.actual_hours/o.est_hours,0)/done.length;
  return `<div class="banner blue" style="margin:14px 0 0">Estimate accuracy from ${done.length} jobs with actual hours: actual ÷ estimate averages <b>${f.toFixed(2)}</b>. ${f>1.05?"Jobs run longer than quoted: consider raising time standards in Settings.":f<0.95?"Jobs run faster than quoted.":"Estimates are on target."}</div>`; }
function machinesHTML(){ const kinds=["saw","waterjet","mill3","mill4","mill5","lathe","livetool","swiss","wedm","grinder","laser","cmm","bench"];
  ensureQueues();
  return `<div class="page"><table class="tbl" id="mtbl"><thead><tr><th style="width:30px"></th><th>Machine</th><th>Type</th><th>Active</th><th>Running now</th><th class="num">Queue</th><th class="num">Queued h</th><th>Notes</th><th></th></tr></thead><tbody>${S.machines.map((m,i)=>{ const L=lane(m.id), h=L.hours;
    return `<tr data-mrow="${i}" style="cursor:default"><td><span class="mhandle" draggable="true" tabindex="0" title="Drag to set the order of lanes on the Board (or Alt+↑/↓)" aria-label="Reorder ${esc(m.name)}">${ic("grip","s")}</span></td><td><input class="inp" data-mf="name" value="${esc(m.name)}" style="height:30px"></td><td><select class="inp" data-mf="kind" style="height:30px;width:130px">${kinds.map(k=>`<option ${k===m.kind?"selected":""}>${k}</option>`).join("")}</select></td><td><input type="checkbox" data-mf="active" ${m.active?"checked":""} aria-label="Active"></td>
     <td class="small">${L.run?`<span class="pill blue">${ic("play","s")}${esc(L.run.o.number)} · Op ${L.run.op.n}</span> <span class="mute">${esc(L.run.o.part||"")}</span>`:`<span class="mute">${m.active?"Idle":"Inactive"}</span>`}</td><td class="num">${L.q.length||""}</td><td class="num">${h?r1(h):""}</td>
     <td><input class="inp" data-mf="note" value="${esc(m.note||"")}" style="height:30px"></td><td><button class="btn ghost sm icon" data-mdel="${i}" aria-label="Delete">${ic("trash","s")}</button></td></tr>`; }).join("")}</tbody></table>
   <button class="btn sm" id="m-add" style="margin-top:10px">${ic("plus","s")}Add machine</button><div class="small mute" style="margin-top:8px">The order here is the order of lanes on the Board. Active machines are the ones the routing engine prefers; operations needing an inactive or missing machine type are flagged to outsource.</div></div>`; }
function wireMachines(){ document.querySelectorAll("[data-mf]").forEach(i=>i.onchange=()=>{ const m=S.machines[+i.closest("[data-mrow]").dataset.mrow]; m[i.dataset.mf]=i.type==="checkbox"?i.checked:i.value; touchCfg(); });
  document.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=async()=>{ if(await confirmBox("Delete machine?","Jobs assigned to it become unassigned.","Delete",true)){ const m=S.machines.splice(+b.dataset.mdel,1)[0]; ensureQueues(); touchCfg(); render(); } });
  const a=$("m-add"); if(a) a.onclick=()=>{ S.machines.push({id:uid("m"),name:"New machine",kind:"mill3",active:true,note:""}); touchCfg(); render(); };
  const T=$("mtbl"); if(!T) return; let from=null;
  const move=(i,j)=>{ if(j<0||j>=S.machines.length||i===j) return; const [m]=S.machines.splice(i,1); S.machines.splice(j,0,m); touchCfg(); render(); setTimeout(()=>document.querySelector(`#mtbl [data-mrow="${j}"] .mhandle`)?.focus(),0); };
  T.addEventListener("dragstart",e=>{ const h=e.target.closest(".mhandle"); if(!h) return; from=+h.closest("[data-mrow]").dataset.mrow; try{ e.dataTransfer.setData("text/plain","m"+from); e.dataTransfer.setDragImage(h.closest("tr"),20,20); }catch(_){} });
  T.addEventListener("dragover",e=>{ const tr=e.target.closest("[data-mrow]"); if(from==null||!tr) return; e.preventDefault(); T.querySelectorAll(".mover").forEach(x=>x.classList.remove("mover")); tr.classList.add("mover"); });
  T.addEventListener("drop",e=>{ const tr=e.target.closest("[data-mrow]"); if(from==null||!tr) return; e.preventDefault(); const to=+tr.dataset.mrow; const f=from; from=null; move(f,to); });
  T.addEventListener("dragend",()=>{ from=null; T.querySelectorAll(".mover").forEach(x=>x.classList.remove("mover")); });
  T.addEventListener("keydown",e=>{ const h=e.target.closest(".mhandle"); if(!h||!e.altKey||!["ArrowUp","ArrowDown"].includes(e.key)) return; e.preventDefault(); const i=+h.closest("[data-mrow]").dataset.mrow; move(i,i+(e.key==="ArrowUp"?-1:1)); }); }
function customers(){ const map=new Map(); for(const r of S.rfqs){ const k=(r.company||"(no company)").trim(); const c=map.get(k)||{name:k,contacts:new Set(),rfqs:[],quoted:0,won:0,last:null}; if(r.contact) c.contacts.add(r.contact); c.rfqs.push(r); c.quoted+=(r.quotes||[]).reduce((s,q)=>s+q.total,0); if(r.status==="Ordered") c.won++; if(!c.last||r.received_at>c.last) c.last=r.received_at; map.set(k,c); }
  for(const o of S.orders) if(o.customer&&!map.has(o.customer)) map.set(o.customer,{name:o.customer,contacts:new Set(),rfqs:[],quoted:0,won:0,last:o.date,jobs:0});
  return [...map.values()].sort((a,b)=>(b.last||"").localeCompare(a.last||"")); }
function viewCustomers(){ setTop(`<h1>Customers</h1><div class="search">${ic("search","s")}<input id="cq" placeholder="Search customers and contacts" value="${esc(UI.cq||"")}"></div><div class="grow"></div><span class="small mute" id="ccount"></span>`);

     </div></aside>`; };
  $("view").innerHTML=`<div class="cwrap ${sel?"withp":""}"><div class="page" style="max-width:none"><table class="tbl"><thead><tr><th>Company</th><th>Contacts</th><th class="num">RFQs</th><th class="num">Ordered</th><th class="num">Win rate</th><th class="num">Quoted value</th><th class="num">Ordered value</th><th class="num">Jobs</th><th>Last RFQ</th></tr></thead><tbody>${cs.map(c=>{ const w=win(c); return `<tr data-cq="${esc(c.name)}" tabindex="0" class="${sel&&sel.name===c.name?"csel":""}"><td><b>${esc(c.name)}</b></td><td class="small">${esc([...c.contacts].join(", "))}</td><td class="num">${c.rfqs.length}</td><td class="num">${c.won}</td><td class="num">${w==null?`<span class="mute">—</span>`:`<span class="winr"><i style="width:${w}%"></i></span>${w}%`}</td><td class="num">${money0(c.quoted)}</td><td class="num">${money0(ordVal(c))}</td><td class="num">${jobsOf(c).length}</td><td class="small">${fmtD(c.last)}</td></tr>`; }).join("")||`<tr><td colspan="9"><div class="empty">${q?"No customers match your search.":"No customers yet."}</div></td></tr>`}</tbody></table><div class="small mute" style="margin-top:8px">Click a customer for contacts, RFQs, jobs and referral source.</div></div>${sel?panel(sel):""}</div>`;

 <h2>Workflow</h2><ol class="small ink2" style="line-height:1.8"><li><b>Create RFQ</b> (ribbon): customer, contact, due date, and drop drawings (PDF), CAD (STEP) and BOM files. One part line is created per drawing and the title block is read from the PDF text layer.</li>

const emailKey=e=>String(e||"").trim().toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g,"_").slice(0,180);
const newCode=()=>{ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; const b=new Uint8Array(8); (window.crypto||{getRandomValues:a=>a.forEach((_,i)=>a[i]=Math.random()*256)}).getRandomValues(b); return [...b].map(x=>A[x%A.length]).join(""); };
function hash53(str,seed=0){ let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed; for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); } h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(36); }
function prefixDb(db,pre){ return {doc:p=>db.doc(pre+p),collection:p=>db.collection(pre+p)}; }
const isAdminRole=()=>!!CO&&(CO.role==="owner"||CO.role==="admin");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- gate (sign-in / create / join) ---- */
function gate(inner){ const g=$("gate"); g.className="gate"; g.innerHTML=`<div class="gcard"><div class="gbrand brand wm" aria-label="Excel SHOPBOSS"><span class="wm-ex">EXCEL</span><span class="wm-sb">SHOPBOSS</span></div>${inner}
  <div class="gdemo"><div><b>Just looking?</b> Explore SHOPBOSS with sample RFQs, orders and machines. No account needed; nothing you do in test mode is saved.</div><button class="btn" id="g-demo" type="button">View in test mode</button></div></div>`;
  const d=$("g-demo"); if(d) d.onclick=startDemo; }
function gateOff(){ const g=$("gate"); g.className="hide"; g.innerHTML=""; }
function gateSignIn(){ gate(`<h1>Sign in to continue</h1><p class="gsub">SHOPBOSS accounts use your Claude sign-in. Open this page while signed in to Claude, with an account the owner has shared this app with, then try again.</p><button class="btn pri" id="g-retry">Try again</button>`); $("g-retry").onclick=()=>bootStorage(); }
function gateError(msg){ gate(`<h1>Something went wrong</h1><div class="gerr">${esc(msg)}</div><button class="btn pri" id="g-retry">Try again</button>`); $("g-retry").onclick=()=>bootStorage(); }

async function bootStorage(){
  gate(`<p class="gmsg">Opening SHOPBOSS…</p>`);
  capUse("sample").then(s=>{ SAMPLE=s; }); capUse("downloads").then(d=>{ DL=d; }); capUse("assets").then(a=>{ ASSETS=a; });
  const [u,db]=await Promise.all([withTimeout(capUse("user"),10000),withTimeout(capUse("db"),10000)]);
  USER=u; ROOT=db;
  if(!u||!db) return gateSignIn();
  try{ ME=await u.me(); }catch(e){ ME=null; }
  if(!ME||!ME.id) return gateSignIn();
  const cw=await u.can("data.write").catch(()=>null); CAN_WRITE=cw!==false;
  try{ await resolveAccount(); }catch(e){ console.error(e); gateError(e?.message||"Couldn't open your account."); }
}
async function resolveAccount(){
  const acc=await ROOT.doc(`data/users/${ME.id}/account`).get();
  if(acc.exists&&acc.data().cid){ const cid=acc.data().cid; const mem=await ROOT.doc(`companies/${cid}/members/${ME.id}`).get(); if(mem.exists) return enterCompany(cid,mem.data().role||"member"); }
  const ek=emailKey(ME.email);
  if(ek&&CAN_WRITE){ const inv=await ROOT.doc("invites/"+ek).get(); if(inv.exists&&inv.data().cid){ try{ return await joinCompany(inv.data().cid,inv.data().role||"member"); }catch(e){ console.error(e); } } }
  return gateWelcome();
}
async function gateWelcome(err=""){
  let legacy=false; try{ legacy=(await USER.isOwner())&&(await ROOT.doc("meta/app").get()).exists; }catch(e){}
  const nSamples=(SEED.rfqs||[]).length;
  gate(`<h1>Welcome to SHOPBOSS</h1><p class="gsub">You're signed in${ME.name?` as <b>${esc(ME.name)}</b>`:""}. Create a company account for your shop, or join the one your team already uses. Everyone in a company shares the same RFQs, orders, settings and mailboxes.</p>
   ${!CAN_WRITE?`<div class="gerr">Your access to this app is view-only, so you can't create or join a company yet. Ask the app owner to share it with you as a Contributor.</div>`:""}
   ${err?`<div class="gerr">${esc(err)}</div>`:""}
   <div class="gcols">
    <form class="gbox" id="g-create"><h2>Create a company account</h2>
     <label class="fld"><span>Company name</span><input class="inp" id="g-name" required maxlength="80" placeholder="Acme Machining Inc."></label>
     <label class="gchk"><input type="checkbox" id="g-samples" checked><span>Start with ${nSamples} sample RFQs so I can look around (you can delete them later)</span></label>
     ${legacy?`<label class="gchk"><input type="checkbox" id="g-legacy" checked><span>Bring in the RFQs, orders and settings already saved in this app (your current data)</span></label>`:""}
     <button class="btn pri" type="submit" ${CAN_WRITE?"":"disabled"}>Create account</button></form>
    <form class="gbox" id="g-join"><h2>Join your team</h2>
     <label class="fld"><span>Invite code</span><input class="inp mono" id="g-code" maxlength="12" placeholder="e.g. K7M2QX9P" autocapitalize="characters" autocomplete="off"></label>
     <p class="small mute" style="margin:0">Get the code from whoever set up your company (Team page). If they added your email address, you're signed in automatically.</p>
     <button class="btn pri" type="submit" ${CAN_WRITE?"":"disabled"}>Join company</button></form>
   </div>`);
  $("g-create").onsubmit=async e=>{ e.preventDefault(); const name=$("g-name").value.trim(); if(!name) return; const b=e.target.querySelector("button"); b.disabled=true; b.textContent="Creating…";
    try{ await createCompany(name,{samples:$("g-samples").checked,legacy:!!$("g-legacy")?.checked}); }catch(x){ console.error(x); gateWelcome(acctErr(x,"create the account")); } };
  $("g-join").onsubmit=async e=>{ e.preventDefault(); const code=$("g-code").value.trim().toUpperCase(); if(!code) return; const b=e.target.querySelector("button"); b.disabled=true; b.textContent="Joining…";
    try{ const jc=await ROOT.doc("joincodes/"+code).get(); if(!jc.exists||!jc.data().cid) throw new Error("That invite code wasn't found. Check it with your team admin."); await joinCompany(jc.data().cid,jc.data().role||"member"); }catch(x){ console.error(x); gateWelcome(acctErr(x,"join")); } };
}
function acctErr(x,what){ const c=x&&x.code;
  if(c==="invalid_argument") return `Couldn't ${what}: your access to this app doesn't allow saving. Ask the owner to share it with you as a Contributor (or higher), then reload.`;
  if(c==="unavailable"||c==="resource_exhausted") return `Couldn't ${what} because the connection dropped. Try again in a moment.`;
  if(c==="quota_exceeded") return `Couldn't ${what}: this app's storage is full.`;
  if(c==="revoked"||c==="not_granted"||c==="capability_disabled") return `Couldn't ${what}: access to this app changed. Reload the page.`;
  return (x&&x.message)?`Couldn't ${what}: ${x.message}`:`Couldn't ${what}. Try again.`; }
async function createCompany(name,setup){
  const cid=uid("c"), now=new Date().toISOString(), code=newCode();
  await ROOT.doc(`companies/${cid}/meta/profile`).set({name,createdBy:ME.id,createdAt:now,joinCode:code,setup,keywords:DEFAULT_KW});
  await ROOT.doc("joincodes/"+code).set({cid,role:"member",createdBy:ME.id,createdAt:now});
  await ROOT.doc(`companies/${cid}/members/${ME.id}`).set({role:"owner",joinedAt:now});
  await ROOT.doc(`data/users/${ME.id}/account`).set({cid});
  await enterCompany(cid,"owner");
}
async function joinCompany(cid,role){
  const pf=await ROOT.doc(`companies/${cid}/meta/profile`).get(); if(!pf.exists) throw new Error("That company no longer exists.");
  await ROOT.doc(`companies/${cid}/members/${ME.id}`).set({role,joinedAt:new Date().toISOString()});
  await ROOT.doc(`data/users/${ME.id}/account`).set({cid});
  await enterCompany(cid,role);
}

/* ---- seeding a brand-new company ---- */
async function seedCompany(setup){
  setSave("Setting up your company…");
  S=seedState(); S.settings=normSettings(mergeDeep(clone(DEFAULT_SETTINGS),S.settings||{}));
  let legacyUsed=false;
  if(setup?.legacy){
    try{
      const c=await ROOT.doc("config/main").get();
      if(c.exists){ const d=c.data(); S.settings=normSettings(mergeDeep(clone(DEFAULT_SETTINGS),d.settings||{})); S.materials=d.materials||S.materials; S.processes=d.processes||S.processes; S.machines=d.machines||S.machines; }
      const rs=await ROOT.collection("rfqs").get(); S.rfqs=rs.docs.map(d=>normRfq(clone(d.data())));
      const os=await ROOT.collection("orders").get(); S.orders=os.docs.map(d=>{ const o=clone(d.data()); o.id=o.id||d.id; return o; });
      legacyUsed=true;
    }catch(e){ console.error("legacy import",e); throw new Error("Couldn't read the existing data to bring it in. Create the account without that option, or try again."); }
  }
  if(!legacyUsed){
    S.settings.shop={name:CO.name,city:"",since:"",about:"",sqft:"",itar:false,industries:"",specialty:"",phone:"",email:"",address:""};
    S.settings.terms="Net 30 days. Prices valid 30 days from quote date. Lead time in working days after receipt of order and approved drawings.";
    S.settings.itar_note="";
    if(!setup?.samples){ S.rfqs=[]; S.orders=[]; }
  }
  await dbWrite(DB.doc("config/main"),configDoc());
  for(const r of S.rfqs) await dbWrite(DB.doc("rfqs/"+r.id),clone(r));
  for(const o of S.orders) await dbWrite(DB.doc("orders/"+o.id),clone(o));
  await dbWrite(DB.doc("meta/app"),{migrated:true,from:legacyUsed?"legacy":"new",at:new Date().toISOString(),version:2});
  return legacyUsed;
}

async function enterCompany(cid,role){
  gate(`<p class="gmsg">Opening your company…</p>`);
  const pf=await ROOT.doc(`companies/${cid}/meta/profile`).get(); if(!pf.exists) throw new Error("This company no longer exists.");
  const p=pf.data(); CO={id:cid,name:p.name||"Your company",role,joinCode:p.joinCode||"",keywords:p.keywords||DEFAULT_KW,setup:p.setup||null};
  DB=prefixDb(ROOT,`companies/${cid}/`); CACHE_KEY="shopboss-cache-"+cid;
  const meta=await DB.doc("meta/app").get(); let seeded=false;
  if(!meta.exists){
    if(role!=="owner"){ gate(`<h1>Almost ready</h1><p class="gsub">${esc(CO.name)} is still being set up by its owner. Try again in a moment.</p><button class="btn pri" id="g-retry">Try again</button>`); $("g-retry").onclick=()=>bootStorage(); return; }
    await seedCompany(CO.setup); seeded=true;
  }
  if(!seeded){ S=readCache()||{...seedState(),rfqs:[],orders:[]}; S.settings=normSettings(mergeDeep(clone(DEFAULT_SETTINGS),S.settings||{})); }
  MODE="db"; subscribeAll(); subscribeCompany(); paintBar();
  const t0=Date.now(); while(!dbLoaded.rfqs&&Date.now()-t0<8000) await sleep(150);
  gateOff(); setSave("All changes saved"); render();
  if(seeded) toast("Company created. Next: check Settings for your shop profile, rates and machines, and open Team to invite people and link mailboxes.",7000);
  setTimeout(()=>syncMail(false),2500); clearInterval(mailTimer); mailTimer=setInterval(()=>{ if(!document.hidden) syncMail(false); },300000);
}
function paintBar(){ const m=$("me"); if(m&&ME){ const n=(ME.name||CO?.name||"?").trim(); m.textContent=n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase()||"?"; m.title=`${ME.name||"You"} · ${CO?.name||""}`; m.style.background=ME.color||"var(--red)"; m.style.cursor="pointer"; m.onclick=()=>go("team"); } const c=$("coName"); if(c) c.textContent=CO?.name||""; }
let removedShown=false;
function subscribeCompany(){
  const base=`companies/${CO.id}/`;
  ROOT.doc(base+"meta/profile").onSnapshot(d=>{ if(!d.exists) return; const p=d.data(); CO.name=p.name||CO.name; CO.joinCode=p.joinCode||""; CO.keywords=p.keywords||CO.keywords; paintBar(); if(R.v==="team") softRender(); },()=>{});
  ROOT.collection(base+"members").onSnapshot(s=>{ MEMBERS=s.docs.map(d=>({id:d.id,...d.data()})); const me=MEMBERS.find(m=>m.id===ME.id);
    if(me){ CO.role=me.role||CO.role; } else if(MEMBERS.length&&!removedShown){ removedShown=true; gate(`<h1>You were removed from ${esc(CO.name)}</h1><p class="gsub">An admin removed your access. Join another company with an invite code, or ask to be added again.</p><button class="btn pri" id="g-back">Continue</button>`); $("g-back").onclick=()=>location.reload(); return; }
    if(R.v==="team") softRender(); },()=>{});
  ROOT.collection(base+"mailboxes").onSnapshot(s=>{ MAILBOXES=s.docs.map(d=>({id:d.id,...d.data()})); if(R.v==="team") softRender(); },()=>{});
  ROOT.collection(base+"invites").onSnapshot(s=>{ INVITES=s.docs.map(d=>({id:d.id,...d.data()})); if(R.v==="team") softRender(); },()=>{});
}

  return `<div class="ptban ${done?"ok":""}"><div class="ptic">${ic("portal")}</div><div class="grow"><b>${done?`Imported from the ${esc(p.name||"customer")} portal`:`The RFQ details are in the ${esc(p.name||"customer")} portal`}</b>
   <div class="small">${done?`${ago(p.importedAt)}${p.by?" by "+esc(p.by):""}. Import again if the buyer changes the RFQ.`:`This email is only a notice. Open the RFQ in the portal, press Ctrl+A then Ctrl+C to copy the page, download the drawings, then click Import and paste.`}</div>
   ${done&&(p.requirements||[]).length?`<ul class="ptreq">${p.requirements.slice(0,8).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>
   <div class="row" style="flex-wrap:nowrap;align-self:flex-start">${link?`<a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">${ic("ext","s")}Open in portal</a>`:""}<button class="btn sm ${done?"":"pri"}" id="pt-imp">${ic("upload","s")}${done?"Import again":"Import"}</button></div></div>`; }

function portalImport(r){
  const pending=[], pts=portals();
  const m=openModal(`<div class="mh"><h2>Import from portal · ${esc(r.number)}</h2><button class="btn ghost icon" data-close aria-label="Close">${ic("x")}</button></div>
  <div class="mb">
   ${pts.length?`<label class="fld" style="max-width:320px"><span>Portal</span><select class="inp" id="pi-pt">${pts.map(p=>`<option value="${esc(p.id)}" ${r.portal?.id===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}<option value="" ${r.portal&&!r.portal.id?"selected":""}>Other portal</option></select></label>`:""}
   <label class="fld" style="margin-top:10px"><span>The RFQ page from the portal: click into the page, press Ctrl+A, Ctrl+C, then paste here</span><textarea class="inp" id="pi-txt" rows="9" placeholder="RFQ number, due date, buyer, line items, quantities, requirements…">${esc(r.portal?.text||"")}</textarea></label>
   <div class="drop" id="pi-drop" style="margin-top:10px" tabindex="0">${ic("upload")}<div style="margin-top:6px"><b>Drop the drawings and models you downloaded from the portal</b></div><div class="small mute">PDF drawings, STEP models, BOMs. Drawings are matched to line items by part number.</div><input type="file" id="pi-file" multiple hidden></div>
   <div class="flist" id="pi-list"></div>
   ${SAMPLE?"":`<div class="banner" style="margin:10px 0 0">Claude isn't connected in this view, so the pasted page is kept on the RFQ and the files are attached, but the line items won't be filled in for you.</div>`}
  </div>
  <div class="mf"><span class="small mute grow" id="pi-msg"></span><button class="btn" data-close>Cancel</button><button class="btn pri" id="pi-go">${ic("upload","s")}Import</button></div>`,{wide:true});
  const el=m.el, drop=el.querySelector("#pi-drop"), fi=el.querySelector("#pi-file"), msg=el.querySelector("#pi-msg");
  const list=()=>{ el.querySelector("#pi-list").innerHTML=pending.map((f,i)=>`<div class="fitem">${ic(ftype(f.name)==="CAD"?"cube":"file","s")}<span class="grow">${esc(f.name)}</span><span class="pill ${ftype(f.name)==="Drawing"?"blue":""}">${ftype(f.name)}</span><span class="tiny mute">${Math.round(f.size/1024)} KB</span><button class="btn ghost sm icon" data-rm="${i}" aria-label="Remove">${ic("x","s")}</button></div>`).join(""); el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ pending.splice(+b.dataset.rm,1); list(); }); };
  const addFiles=fs=>{ for(const f of fs) pending.push(f); list(); };
  drop.onclick=()=>fi.click(); drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fi.click(); } };
  fi.onchange=()=>{ addFiles([...fi.files]); fi.value=""; };
  drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); addFiles([...e.dataTransfer.files]); };
  el.querySelector("#pi-go").onclick=async()=>{
    const text=el.querySelector("#pi-txt").value.trim(); if(!text&&!pending.length){ msg.textContent="Paste the portal page or add the downloaded files first."; return; }
    const btn=el.querySelector("#pi-go"); btn.disabled=true;
    const sel=el.querySelector("#pi-pt"); const pt=sel?pts.find(p=>p.id===sel.value)||null:null;
    let res=null;
    if(text&&SAMPLE){ msg.textContent="Claude is reading the portal page…";
      try{ res=await SAMPLE.json(portalPrompt(text,pt),{modelTier:"complex",onText:()=>{ msg.textContent="Claude is writing…"; }}); }
      catch(e){ console.error(e); msg.textContent=aiErr(e)+" You can try again."; btn.disabled=false; return; } }
    const out=applyPortal(r,res,text,pt); m.close();
    if(pending.length) await addFilesToRfq(r,pending); else { touchRfq(r); render(); }
    toast(res?`Imported: ${out.added} line item${out.added===1?"":"s"} added, ${out.updated} updated${pending.length?`, ${pending.length} file${pending.length===1?"":"s"} attached`:""}.`:"Portal page saved on the RFQ"+(pending.length?" and files attached.":"."),6000);
  };
  setTimeout(()=>el.querySelector("#pi-txt")?.focus(),50);
}
function portalPrompt(text,pt){ return `You are reading a page copied from a customer's supplier portal${pt?` (${pt.name})`:""}. A CNC machine shop needs to quote this RFQ. The text may include menus, headers and footers: ignore them.
Extract only what is on the page. Use null for anything missing; never guess or fill from general knowledge.
Return ONLY JSON in exactly this shape:
{"customer_rfq_no":null,"company":"the buying company or agency",
"buyer":{"name":null,"email":null,"phone":null},
"due_date":"YYYY-MM-DD when the quote/bid is due, or null",
"need_by":"YYYY-MM-DD delivery date wanted, or null",
"requirements":["short verbatim quality, compliance, shipping or terms requirements: ITAR/EAR, certs, FAI/AS9102, AS9100, DFARS, source inspection, packaging, payment terms"],
"lines":[{"line":"1","part_number":"exact part number","rev":null,"description":null,"material":null,"finish":null,"quantities":[10],"uom":"EA","notes":null}]}
One entry in "lines" per line item. "quantities" holds every quantity or price break asked for that line, as numbers. At most 60 lines and 12 requirements.
Page text:
"""
${text.slice(0,30000)}
"""`; }
function applyPortal(r,res,text,pt){
  const now=new Date().toISOString(); let added=0, updated=0;
  if(!r.portal) r.portal=pt?{id:pt.id,name:pt.name,url:pt.url,link:pt.url}:{id:"",name:"customer",url:"",link:""};
  else if(pt&&r.portal.id!==pt.id){ r.portal.id=pt.id; r.portal.name=pt.name; r.portal.url=pt.url; if(!r.portal.link) r.portal.link=pt.url; }
  if(text) r.portal.text=text.slice(0,30000);
  const str=v=>v==null?"":String(v).trim();
  if(res&&typeof res==="object"){
    if(str(res.customer_rfq_no)) r.customer_rfq_no=str(res.customer_rfq_no);
    if(str(res.company)&&(!str(r.company)||r.portalWaiting)) r.company=str(res.company);
    else if(!str(r.company)&&pt?.customer) r.company=pt.customer;
    if(str(res.buyer?.name)) r.contact=str(res.buyer.name);
    if(str(res.buyer?.email)&&/@/.test(res.buyer.email)) r.email_addr=str(res.buyer.email).toLowerCase();
    if(/^\d{4}-\d\d-\d\d$/.test(str(res.due_date))) r.due=str(res.due_date);
    r.portal.requirements=(Array.isArray(res.requirements)?res.requirements:[]).map(str).filter(Boolean).slice(0,12);
    if(/^\d{4}-\d\d-\d\d$/.test(str(res.need_by))) r.portal.needBy=str(res.need_by);
    let line=topParts(r).length; const src=`portal (${r.portal.name||"customer"})`;
    for(const L of (Array.isArray(res.lines)?res.lines:[]).slice(0,60)){
      const pn=str(L?.part_number).toUpperCase(); if(!pn) continue;
      const qs=(Array.isArray(L.quantities)?L.quantities:[L.quantities]).map(x=>parseInt(String(x).replace(/,/g,""))).filter(x=>x>0);
      const tb={}; const tset=(k,v)=>{ if(str(v)) tb[k]={v:str(v),c:0.8,s:src}; };
      tset("part_number",pn); tset("revision",L.rev); tset("description",L.description); tset("material",L.material); tset("finish",L.finish);
      let p=r.parts.find(x=>!x.parentId&&String(x.part_number||"").toUpperCase()===pn);
      if(!p){ p=normPart({id:uid("p"),line:++line,process:"CNC MILLING",kind:"machined",part_number:pn,rev:str(L.rev),description:str(L.description),qtys:qs.length?qs:[1],drawingFileId:null,tb,tols:[],ops:[],
          warnings:["From the portal: download this part's drawing from the portal and drop it on the RFQ."]}); r.parts.push(p); added++; }
      else { if(qs.length) p.qtys=qs; if(str(L.rev)&&!p.rev) p.rev=str(L.rev); if(str(L.description)&&!p.description) p.description=str(L.description);
        for(const [k,v] of Object.entries(tb)) if(!p.tb[k]?.v) p.tb[k]=v; if(p.material&&!p.material.code){ const g=guessMaterialCode(p); if(g) p.material.code=g; } updated++; }
      const nt=[str(L.notes),str(L.uom)&&str(L.uom).toUpperCase()!=="EA"?"Unit of measure: "+str(L.uom):""].filter(Boolean).join("\n");
      if(nt&&!String(p.notes.customer||"").includes(nt)) p.notes.customer=[p.notes.customer,nt].filter(Boolean).join("\n");
    }
  }
  r.portal.status="imported"; r.portal.importedAt=now; r.portal.by=ME?.name||""; r.portalWaiting=false;
  logT(r,res?`Imported from the ${r.portal.name||"customer"} portal: ${added} line item(s) added, ${updated} updated`:`Portal page saved from the ${r.portal.name||"customer"} portal`);
  return {added,updated};
}
function newPortalRfq(pt){
  const now=new Date().toISOString();
  const r=normRfq({id:uid("r"),number:nextRfqNumber(),company:pt?.customer||"",contact:"",email_addr:"",customer_rfq_no:"",status:"New",received_at:now,
    email:{from:"",subject:"",body:"",at:null},files:[],parts:[],timeline:[{at:now,text:`RFQ started from the ${pt?pt.name:"customer"} portal`}],quotes:[],
    portal:pt?{id:pt.id,name:pt.name,url:pt.url,link:pt.url,status:"waiting"}:{id:"",name:"customer",url:"",link:"",status:"waiting"},portalWaiting:true});
  S.rfqs.push(r); touchRfq(r); UI.wsTab="overview"; saveUI(); go("rfq-"+r.id); setTimeout(()=>portalImport(r),250);
}
function viewPortals(){
  setTop(`<h1>Customer portals</h1><span class="small mute">Supplier portals your customers post RFQs on</span>`);
  const pts=portals(); const waiting=S.rfqs.filter(r=>r.portal&&r.portal.status!=="imported"&&r.status!=="No Bid").sort((a,b)=>String(b.received_at).localeCompare(String(a.received_at)));
  const recent=S.rfqs.filter(r=>r.portal&&r.portal.status==="imported").sort((a,b)=>String(b.portal.importedAt).localeCompare(String(a.portal.importedAt))).slice(0,6);
  const rfqRow=r=>{ const link=/^https?:/.test(r.portal.link||"")?r.portal.link:r.portal.url; return `<tr><td><a href="#rfq-${esc(r.id)}" class="mono">${esc(r.number)}</a></td><td>${esc(r.company||"(no company)")}<div class="tiny mute">${esc(r.email?.subject||"")}</div></td><td><span class="pill">${esc(r.portal.name||"Portal")}</span></td><td class="small">${r.portal.status==="imported"?esc(ago(r.portal.importedAt)):esc(ago(r.received_at))}</td>
    <td><div class="row" style="flex-wrap:nowrap">${/^https?:/.test(link||"")?`<a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">${ic("ext","s")}Open in portal</a>`:""}<button class="btn sm ${r.portal.status==="imported"?"":"pri"}" data-pimp="${esc(r.id)}">${r.portal.status==="imported"?"Open RFQ":"Import"}</button></div></td></tr>`; };
  $("view").innerHTML=`<div class="page tm">
   <div class="card"><div class="card-h"><h3>${ic("portal","s")}Waiting for portal details</h3>${waiting.length?`<span class="pill red">${waiting.length}</span>`:""}<div class="grow"></div>
     ${pts.length?`<select class="inp" id="pt-newsel" style="height:30px;width:auto">${pts.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("")}</select>`:""}<button class="btn sm" id="pt-new">${ic("plus","s")}New RFQ from a portal</button></div><div class="card-b">
    ${waiting.length?`<div class="tblwrap"><table><thead><tr><th>RFQ</th><th>Customer</th><th>Portal</th><th>Received</th><th></th></tr></thead><tbody>${waiting.map(rfqRow).join("")}</tbody></table></div>`:`<div class="small mute" style="padding:4px 0">Nothing waiting. When a portal emails one of your linked mailboxes, the RFQ shows up here until its details are imported.</div>`}
    ${recent.length?`<div class="tiny mute" style="margin:14px 0 4px">Recently imported</div><div class="tblwrap"><table><tbody>${recent.map(rfqRow).join("")}</tbody></table></div>`:""}
   </div></div>
   <div class="card"><div class="card-h"><h3>${ic("gear","s")}Linked portals</h3></div><div class="card-b">
    <p class="note">How it works: when a portal emails one of the mailboxes linked on the Team page ("new RFQ posted", "invitation to bid"…), SHOPBOSS spots the sender or the portal's web address, creates an RFQ tagged with the portal, and links straight to it. The RFQ details sit behind the portal's sign-in, so open the RFQ in the portal, copy the page and download the drawings, then click Import on the RFQ: Claude fills in the customer RFQ number, due date, buyer, line items, quantities and requirements, and the drawings attach to the matching parts. Portal passwords are never stored in SHOPBOSS.</p>
    ${pts.length?`<div class="tblwrap"><table><thead><tr><th>Portal name</th><th>Portal web address</th><th>Emails come from</th><th>Customer (optional)</th><th></th></tr></thead><tbody>${pts.map((p,i)=>`<tr data-prow="${i}">
      <td><input class="inp" data-pf="name" value="${esc(p.name)}" maxlength="40"></td><td><div class="row" style="flex-wrap:nowrap"><input class="inp" data-pf="url" value="${esc(p.url)}">${/^https?:/.test(p.url||"")?`<a class="btn sm icon" href="${esc(p.url)}" target="_blank" rel="noopener" aria-label="Open portal" title="Open portal">${ic("ext","s")}</a>`:""}</div></td>
      <td><input class="inp" data-pf="senders" value="${esc(p.senders)}" placeholder="vendra.io"></td><td><input class="inp" data-pf="customer" value="${esc(p.customer||"")}" placeholder="Filled from the portal page"></td>
      <td><button class="btn sm red" data-pdel="${i}">Remove</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="small mute">No portals linked yet.</div>`}
    <form id="pt-form" class="frm">
     <label class="fld"><span>Portal name</span><input class="inp" id="pt-name" required maxlength="40" placeholder="Vendra"></label>
     <label class="fld"><span>Portal web address</span><input class="inp" id="pt-url" type="url" required placeholder="https://supplier-portal.example.com"></label>
     <label class="fld"><span>Emails come from (domain or address)</span><input class="inp" id="pt-snd" placeholder="example.com, noreply@example.com"></label>
     <label class="fld"><span>Customer (optional, if one portal = one customer)</span><input class="inp" id="pt-cust"></label>
     <div style="grid-column:1/-1"><button class="btn pri" type="submit">${ic("plus","s")}Add portal</button> <span class="small mute">"Emails come from" is how SHOPBOSS spots the portal's notices. Open one of the portal's emails and copy the sender's domain.</span></div>
    </form>
   </div></div></div>`;
  const v=$("view"), q=s=>v.querySelector(s), qa=s=>[...v.querySelectorAll(s)];
  qa("[data-pimp]").forEach(b=>b.onclick=()=>{ const r=rfqById(b.dataset.pimp); if(!r) return; UI.wsTab="overview"; saveUI(); go("rfq-"+r.id); if(r.portal.status!=="imported") setTimeout(()=>portalImport(r),250); });
  q("#pt-new").onclick=()=>{ const sel=q("#pt-newsel"); newPortalRfq(sel?pts.find(p=>p.id===sel.value):null); };
  qa("[data-pf]").forEach(i=>i.onchange=()=>{ const pt=pts[+i.closest("[data-prow]").dataset.prow]; if(!pt) return; pt[i.dataset.pf]=i.value.trim(); touchCfg(); toast("Portal saved"); });
  qa("[data-pdel]").forEach(b=>armed(b,()=>{ pts.splice(+b.dataset.pdel,1); touchCfg(); render(); toast("Portal removed. RFQs already received keep their link."); },"Confirm remove"));
  q("#pt-form").onsubmit=e=>{ e.preventDefault(); const url=q("#pt-url").value.trim(); let snd=q("#pt-snd").value.trim(); if(!snd){ const hst=hostOf(url); snd=baseDom(hst); }
    S.settings.portals=S.settings.portals||[]; S.settings.portals.push({id:uid("pt"),name:q("#pt-name").value.trim(),url,senders:snd,customer:q("#pt-cust").value.trim()}); touchCfg(); render(); toast("Portal added. New notices from it are picked up on the next mail check."); };
}

/* ================= GLOBAL EVENTS & BOOT ================= */
document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(!g) return; const h=g.dataset.go; if(h==="tour"){ startTour(0); return; } go(h); });
document.addEventListener("keydown",e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");
  if(e.key==="Escape"){ if(popEl){ closePop(); return; } if(modalStack.length){ modalStack[modalStack.length-1](); return; } document.querySelector(".tour")?.remove(); }
  if(e.key==="/"&&!typing){ const q=$("q")||$("oq"); if(q){ e.preventDefault(); q.focus(); } }
  if(R.v==="part"&&e.altKey&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&!modalStack.length){ e.preventDefault(); $(e.key==="ArrowLeft"?"q-prev":"q-next")?.click(); }
  if(R.v==="part"&&(e.ctrlKey||e.metaKey)&&e.key==="Enter"&&!modalStack.length){ e.preventDefault(); $("q-done")?.click(); }
});
window.addEventListener("hashchange",render);
let rsT=null; window.addEventListener("resize",()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(R.v==="part"){ const vs=VSTATE[R.pid]; vs?.redraw&&vs.redraw(); } },200); });
window.addEventListener("error",e=>console.error("app error",e.error||e.message));
bootStorage();

}
